*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}

.tb-link i{font-size:var(--ax-text-lg)}
.tb-link:hover,.tb-link.active{color:var(--ax-gray-700,#414651)}.tb-link,.tb-link:hover,.tb-link:focus{text-decoration:none}.tb-link.active{font-weight:600}.tb-link,.tb-link:focus,.tb-link:focus-visible,.tb-link.active{outline:none;box-shadow:none;border:none}
.tb-profile{display:inline-flex;align-items:center;gap:0.625rem;flex-shrink:0;font-size:var(--ax-text-md);font-weight:500;color:var(--ax-text-primary);text-decoration:none;cursor:pointer}
.tb-profile i.bi-person-circle{font-size:1.375rem;color:var(--ax-text-tertiary)}

.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:0.625rem;font-size:var(--ax-text-md);font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:var(--ax-space-1-5) var(--ax-space-2);border-radius:var(--ax-radius-md);transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-100)}
.tb-profile-btn i.bi-person-circle{font-size:1.375rem;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:var(--ax-text-sm);color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 0.625rem);right:0;min-width:15rem;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:var(--ax-radius-xl);box-shadow:var(--ax-shadow-md, 0 12px 24px -8px rgba(10,13,18,.18));padding:var(--ax-space-2);z-index:40}

.tb-menu-item:hover{background:var(--ax-gray-100)}
.tb-menu-item i{font-size:var(--ax-text-lg);color:var(--ax-text-tertiary);width:1.25rem;flex-shrink:0}

.page{max-width:none;margin:0 10.3125rem;padding:var(--ax-space-8) var(--ax-space-10) 3.75rem}
.page-title-row{display:flex;align-items:center;gap:0.875rem;flex-wrap:wrap}
.page-title{font-size:var(--ax-h4);font-weight:700;line-height:1.1;margin:0;letter-spacing:-.01em}
.ind-badge{display:inline-flex;align-items:center;font-size:0.8125rem;font-weight:700;letter-spacing:.03em;color:var(--ax-warning-700);background:var(--ax-warning-50);border-radius:var(--ax-radius-sm);padding:var(--ax-space-1) 0.6875rem}

.cp-banner{display:flex;align-items:center;gap:0.875rem;background:var(--ax-warning-50);color:var(--ax-warning-700);border-radius:var(--ax-radius-xl);padding:var(--ax-space-4) 1.375rem;margin-bottom:1.625rem;font-size:var(--ax-text-md);line-height:1.4}
.cp-banner b{font-weight:700}
.cp-banner a{color:var(--ax-warning-700);font-weight:700;text-decoration:underline;text-underline-offset:0.125rem;display:inline-flex;align-items:center;gap:var(--ax-space-1-5);cursor:pointer}
.cp-banner .x{margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;font-size:var(--ax-text-lg);line-height:1;padding:var(--ax-space-0-5);display:inline-flex;flex-shrink:0;opacity:.7}
.cp-banner .x:hover{opacity:1}

.col{display:flex;flex-direction:column;gap:var(--ax-space-6)}

.card-head h2{font-size:var(--ax-text-xl);font-weight:700;margin:0;line-height:1.25}
.card-head p{font-size:0.9375rem;color:var(--ax-text-tertiary);margin:var(--ax-space-1-5) 0 0;line-height:1.4}
.divider{border:none;border-top:1px solid var(--ax-border-subtle);margin:var(--ax-space-5) 0}

.ro-group{display:flex;flex-direction:column;gap:1.125rem}
.ro-field .ro-label{font-size:var(--ax-text-sm);color:var(--ax-text-tertiary);margin-bottom:0.1875rem}
.ro-field .ro-value{font-size:1.0625rem;font-weight:600;color:var(--ax-text-primary);line-height:1.3}
.ro-field .ro-sub{font-size:0.9375rem;color:var(--ax-text-tertiary);margin-top:var(--ax-space-0-5)}
.actions{display:flex;gap:var(--ax-space-3);margin-top:var(--ax-space-6)}
/* ---- Form fields ---- */
.fields{display:flex;flex-direction:column;gap:1.125rem}
.field{display:flex;flex-direction:column}
.flabel{font-size:0.9375rem;font-weight:500;color:var(--ax-text-primary);margin-bottom:0.4375rem}
.req{color:var(--ax-danger-600)}
.opt{font-weight:400;color:var(--ax-text-tertiary);margin-left:var(--ax-space-1)}

.tinput:hover{border-color:var(--ax-border-strong)}
.tinput:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}

.tinput.err{border-color:var(--ax-border-error)}
.tselect-wrap{position:relative}

.tselect:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}

.tselect-wrap > i{position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ax-text-tertiary);font-size:var(--ax-text-sm)}
.field-err{font-size:var(--ax-text-sm);color:var(--ax-text-error);margin-top:var(--ax-space-1-5)}

.pwrap .tinput{padding-right:2.875rem}

.addr-saved .addr-label{font-size:var(--ax-text-md);font-weight:700;margin-bottom:var(--ax-space-2)}
