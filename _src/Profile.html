*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}
/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:36px;height:72px;padding:0 40px;background:var(--ax-surface-card);border-bottom:1px solid var(--ax-border-subtle)}
.tb-logo{display:flex;align-items:center;flex-shrink:0}
.tb-nav{display:flex;align-items:center;gap:28px;flex:1}
.tb-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ax-text-tertiary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;transition:color .15s ease}
.tb-link i{font-size:18px}
.tb-link:hover,.tb-link.active{color:var(--ax-gray-700,#414651)}.tb-link.active{font-weight:600}.tb-link,.tb-link:focus,.tb-link:focus-visible,.tb-link.active{outline:none;box-shadow:none;border:none}
.tb-profile{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;cursor:pointer}
.tb-profile i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary)}
.tb-profile.active{color:var(--ax-sea-depths)}
.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-100)}
.tb-profile-btn i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:var(--ax-shadow-md, 0 12px 24px -8px rgba(10,13,18,.18));padding:8px;z-index:40}
.tb-menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:8px;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s ease}
.tb-menu-item:hover{background:var(--ax-gray-100)}
.tb-menu-item i{font-size:18px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.tb-menu-sep{border:none;border-top:1px solid var(--ax-border-subtle);margin:6px 6px}
/* ---- Page ---- */
.page{max-width:none;margin:0 165px;padding:32px 40px 60px}
.page-title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:700;line-height:1.1;margin:0;letter-spacing:-.01em}
.ind-badge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--ax-warning-700);background:var(--ax-warning-50);border-radius:6px;padding:4px 11px}
.page-sub{font-size:16px;color:var(--ax-text-tertiary);margin:8px 0 26px}
/* ---- Complete profile banner ---- */
.cp-banner{display:flex;align-items:center;gap:14px;background:var(--ax-warning-50);color:var(--ax-warning-700);border-radius:12px;padding:16px 22px;margin-bottom:26px;font-size:16px;line-height:1.4}
.cp-banner b{font-weight:700}
.cp-banner a{color:var(--ax-warning-700);font-weight:700;text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.cp-banner .x{margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;font-size:18px;line-height:1;padding:2px;display:inline-flex;flex-shrink:0;opacity:.7}
.cp-banner .x:hover{opacity:1}
/* ---- Layout ---- */
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:24px}
.card{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:14px;box-shadow:var(--ax-shadow-xs);padding:26px 28px}
.card-head h2{font-size:20px;font-weight:700;margin:0;line-height:1.25}
.card-head p{font-size:15px;color:var(--ax-text-tertiary);margin:6px 0 0;line-height:1.4}
.divider{border:none;border-top:1px solid var(--ax-border-subtle);margin:20px 0}
/* ---- Read-only fields ---- */
.ro-group{display:flex;flex-direction:column;gap:18px}
.ro-field .ro-label{font-size:14px;color:var(--ax-text-tertiary);margin-bottom:3px}
.ro-field .ro-value{font-size:17px;font-weight:600;color:var(--ax-text-primary);line-height:1.3}
.ro-field .ro-sub{font-size:15px;color:var(--ax-text-tertiary);margin-top:2px}
.actions{display:flex;gap:12px;margin-top:24px}
/* ---- Form fields ---- */
.fields{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column}
.flabel{font-size:15px;font-weight:500;color:var(--ax-text-primary);margin-bottom:7px}
.req{color:var(--ax-danger-600)}
.opt{font-weight:400;color:var(--ax-text-tertiary);margin-left:4px}
.tinput{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.tinput:hover{border-color:var(--ax-border-strong)}
.tinput:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tinput::placeholder{color:var(--ax-text-placeholder)}
.tinput.err{border-color:var(--ax-border-error)}
.tselect-wrap{position:relative}
.tselect{width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--ax-border);border-radius:8px;padding:12px 40px 12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.tselect:hover{border-color:var(--ax-border-strong)}
.tselect:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tselect.placeholder{color:var(--ax-text-placeholder)}
.tselect-wrap > i{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ax-text-tertiary);font-size:14px}
.field-err{font-size:14px;color:var(--ax-text-error);margin-top:6px}
.pwrap{position:relative;display:flex;align-items:center}
.pwrap .tinput{padding-right:46px}
.peye{position:absolute;right:12px;background:none;border:none;cursor:pointer;color:var(--ax-text-tertiary);font-size:18px;padding:4px;display:inline-flex}
.peye:hover{color:var(--ax-text-primary)}
/* ---- Address saved ---- */
.addr-saved .addr-label{font-size:16px;font-weight:700;margin-bottom:8px}
.addr-saved .addr-lines{font-size:16px;color:var(--ax-text-primary);line-height:1.55}
.muted{font-size:16px;color:var(--ax-text-tertiary)}
.addbtn{display:inline-flex;align-items:center;gap:9px;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;padding:11px 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-text-primary);cursor:pointer;box-shadow:var(--ax-shadow-xs);margin-top:18px;transition:border-color .12s ease,background .12s ease}
.addbtn:hover{border-color:var(--ax-border-strong);background:var(--ax-gray-100)}
.addbtn i{font-size:15px;color:var(--ax-text-tertiary)}
/* ---- Preferences ---- */
.pref-block{margin-top:2px}
.pref-block h3{font-size:18px;font-weight:700;margin:0 0 2px}
.pref-block .pref-sub{font-size:15px;color:var(--ax-text-tertiary);margin:0 0 12px}








.reqlist{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.reqlist li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ax-text-tertiary)}
.reqlist li i{font-size:17px;color:var(--ax-gray-400)}
.reqlist li.met i{color:var(--ax-success-600)}
.modal-banner{display:flex;align-items:flex-start;gap:12px;background:var(--ax-danger-50);color:var(--ax-danger-600);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.4;margin-bottom:18px}
.modal-banner i{font-size:18px;flex-shrink:0;margin-top:1px}
.modal-banner b{display:block;font-weight:700;margin-bottom:1px}

function ProfileMenu({ active }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onEsc);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onEsc); };

    <div className="tb-profile-wrap" ref={ref}>

  return (
    <div className="field">
      <label className="flabel">{label}{required ? <span className="req"> *</span> : null}{optional ? <span className="opt">(optional)</span> : null}</label>
      <input className={"tinput" + (error ? " err" : "")} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
      {error ? <div className="field-err">{error}</div> : null}
    </div>
  );
}

function SelectField({ label, value, onChange, placeholder, options }) {
  return (
    <div className="field">
      <label className="flabel">{label}</label>
      <div className="tselect-wrap">
        <select className={"tselect" + (value ? "" : " placeholder")} value={value} onChange={(e) => onChange(e.target.value)}>
          <option value="">{placeholder}</option>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
        <i className="bi bi-chevron-down"></i>
      </div>
    </div>
  );
}

function PersonalInfoCard({ profile, onSave }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(profile);
  const [errors, setErrors] = useState({});

  const start = () => { setDraft(profile); setErrors({}); setEditing(true); };
  const set = (patch) => setDraft((d) => ({ ...d, ...patch }));

  const save = () => {
    const e = {};
    if (!draft.firstName.trim()) e.firstName = "First name is required.";
    if (!draft.lastName.trim()) e.lastName = "Last name is required.";
    setErrors(e);
    if (Object.keys(e).length) return;
    onSave({ firstName: draft.firstName, lastName: draft.lastName, title: draft.title, company: draft.company, phone: draft.phone });
    setEditing(false);
  };

  const titleLine = [profile.title, profile.company].filter(Boolean).join(", ");

  return (
    <div className="card">
      <div className="card-head">
        <h2>Personal Information</h2>
        <p>Update your personal details and contact information.</p>
      </div>
      <hr className="divider" />
      {!editing ? (
        <React.Fragment>
          <div className="ro-group">
            <div className="ro-field">
              <div className="ro-label">First and Last Name</div>
              <div className="ro-value">{profile.firstName} {profile.lastName}</div>
              {titleLine ? <div className="ro-sub">{titleLine}</div> : null}
            </div>
            <div className="ro-field">
              <div className="ro-label">Email</div>
              <div className="ro-value">{profile.email}</div>
            </div>
            <div className="ro-field">
              <div className="ro-label">Phone Number</div>
              <div className="ro-value">{profile.phone || "—"}</div>
            </div>
          </div>
          <div className="actions">
            <Button variant="secondary" size="md" onClick={start}>Edit Personal Information</Button>
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="fields">
            <TextField label="First Name" required value={draft.firstName} onChange={(v) => set({ firstName: v })} placeholder="Enter first name" error={errors.firstName} />
            <TextField label="Last Name" required value={draft.lastName} onChange={(v) => set({ lastName: v })} placeholder="Enter last name" error={errors.lastName} />
            <TextField label="Title" optional value={draft.title} onChange={(v) => set({ title: v })} placeholder="Enter title" />
            <TextField label="Company" optional value={draft.company} onChange={(v) => set({ company: v })} placeholder="Enter company" />
            <TextField label="Phone Number" optional value={draft.phone} onChange={(v) => set({ phone: v })} placeholder="Enter phone number" />
          </div>
          <div className="actions">
            <Button variant="secondary" size="md" onClick={() => setEditing(false)}>Cancel</Button>
            <Button variant="primary" size="md" onClick={save}>Change Information</Button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

const EMPTY_ADDR = { addr1: "", addr2: "", country: "", state: "", city: "", zip: "" };

function AddressCard({ address, onSave }) {
  const [mode, setMode] = useState("view"); // 'view' | 'edit'
  const [draft, setDraft] = useState(address || EMPTY_ADDR);
  const set = (patch) => setDraft((d) => ({ ...d, ...patch }));

  const startAdd = () => { setDraft(EMPTY_ADDR); setMode("edit"); };
  const startEdit = () => { setDraft(address); setMode("edit"); };
  const save = () => { onSave(draft); setMode("view"); };

  const isEdit = mode === "edit";
  const isNew = !address;

  return (
    <div className="card">
      <div className="card-head">
        <h2>Address Information</h2>
        <p>Manage your saved address.</p>
      </div>
      <hr className="divider" />
      {isEdit ? (
        <React.Fragment>
          <div className="fields">
            <TextField label="Address Line 1" value={draft.addr1} onChange={(v) => set({ addr1: v })} placeholder="Enter address" />
            <TextField label="Address Line 2" value={draft.addr2} onChange={(v) => set({ addr2: v })} placeholder="Enter address" />
            <SelectField label="Country" value={draft.country} onChange={(v) => set({ country: v, state: "" })} placeholder="Select country" options={COUNTRIES} />
            {draft.country && !statesFor(draft.country).length ?
            <TextField label="State / Region" value={draft.state} onChange={(v) => set({ state: v })} placeholder="Enter state or region" /> :
            <SelectField label="State" value={draft.state} onChange={(v) => set({ state: v })} placeholder={draft.country ? "Select state" : "Select country first"} options={statesFor(draft.country, draft.state)} />}
            <TextField label="City" value={draft.city} onChange={(v) => set({ city: v })} placeholder="Enter city" />
            <TextField label="Zip Code" value={draft.zip} onChange={(v) => set({ zip: v })} placeholder="Enter zip code" />
          </div>
          <div className="actions">
            <Button variant="secondary" size="md" onClick={() => setMode("view")}>Cancel</Button>
            <Button variant="primary" size="md" onClick={save}>{isNew ? "Add Address" : "Change Address"}</Button>
          </div>
        </React.Fragment>
      ) : address ? (
        <React.Fragment>
          <div className="addr-saved">
            <div className="addr-label">Default Address</div>
            <div className="addr-lines">
              {address.addr1}{address.addr2 ? <React.Fragment><br />{address.addr2}</React.Fragment> : null}<br />
              {[address.city, address.state].filter(Boolean).join(", ")}{address.zip ? " " + address.zip : ""}<br />
              {address.country}
            </div>
          </div>
          <div className="actions">
            <Button variant="secondary" size="md" onClick={startEdit}>Edit Address</Button>
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="muted">No address added yet.</div>
          <button className="addbtn" onClick={startAdd}><i className="bi bi-plus-lg"></i>Add Address</button>
        </React.Fragment>
      )}
    </div>
  );
}

function PreferencesCard({ profile, onSave }) {
  return (
    <div className="card">
      <div className="card-head">
        <h2>Preferences</h2>
        <p>Customize your account preferences and settings.</p>
      </div>
      <hr className="divider" />
      <div className="pref-block">
        <h3>Time zone</h3>
        <p className="pref-sub">Select your time zone</p>
        <div className="tselect-wrap">
          <select className="tselect" value={profile.timezone} onChange={(e) => onSave({ timezone: e.target.value })}>
            {TIMEZONES.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
          <i className="bi bi-chevron-down"></i>
        </div>
      </div>
    </div>
  );
}

function SecurityCard({ onChangePassword }) {
  return (
    <div className="card">
      <div className="card-head">
        <h2>Security Settings</h2>
        <p>Manage your password.</p>
      </div>
      <hr className="divider" />
      <div className="pref-block">
        <h3>Password</h3>
        <p className="pref-sub">Set a unique password to protect your account.</p>
        <Button variant="secondary" size="md" onClick={onChangePassword}>Change Password</Button>
      </div>
    </div>
  );
}

function PasswordInput({ label, value, onChange, placeholder, error }) {
  const [show, setShow] = useState(false);
  return (
    <div className="field">
      <label className="flabel">{label} <span className="req">*</span></label>
      <div className="pwrap">
        <input className={"tinput" + (error ? " err" : "")} type={show ? "text" : "password"} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
        <button className="peye" type="button" aria-label={show ? "Hide" : "Show"} onClick={() => setShow((s) => !s)}>
          <i className={"bi " + (show ? "bi-eye-slash" : "bi-eye")}></i>
        </button>
      </div>
      {error ? <div className="field-err">{error}</div> : null}
    </div>
  );
}

function checkReqs(pw) {
  return {
    lower: /[a-z]/.test(pw),
    upper: /[A-Z]/.test(pw),
    number: /[0-9]/.test(pw),
    special: /[^A-Za-z0-9]/.test(pw),
    length: pw.length >= 11,
  };
}

function ChangePasswordModal({ onClose, onSuccess }) {
  const [oldPw, setOldPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [errors, setErrors] = useState({});
  const [systemError, setSystemError] = useState(false);

  const reqs = checkReqs(newPw);
  const allMet = Object.values(reqs).every(Boolean);

  const submit = () => {
    const e = {};
    setSystemError(false);
    // Hidden trigger to preview the system-error banner: old password "fail".
    if (oldPw === "fail") { setSystemError(true); return; }
    if (!oldPw) e.oldPw = "Current password is required.";
    else if (oldPw !== CURRENT_PASSWORD) e.oldPw = "*Incorrect current password. Please try again.";
    if (!allMet) e.newPw = "Password does not meet requirements.";
    if (!checkReqs(confirmPw).length || confirmPw !== newPw) e.confirmPw = confirmPw !== newPw ? "Passwords do not match." : "Password does not meet requirements.";
    setErrors(e);
    if (Object.keys(e).length === 0) onSuccess();
  };

  const REQ_ITEMS = [
    ["lower", "One lowercase character"],
    ["upper", "One uppercase character"],
    ["number", "One number character"],
    ["special", "One special character"],
    ["length", "11+ characters"],
  ];

  return (
    <div className="scrim" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Password &amp; Security</h2>
          <button className="modal-x" aria-label="Close" onClick={onClose}><i className="bi bi-x-lg"></i></button>
        </div>
        <div className="modal-body">
          <p className="modal-sub">Create a new password for your account.</p>
          {systemError ? (
            <div className="modal-banner">
              <i className="bi bi-x-circle-fill"></i>
              <span><b>Problem resetting password</b>We are having trouble resetting your password. Please resubmit the form or try again later.</span>
            </div>
          ) : null}
          <div className="fields">
            <PasswordInput label="Old Password" value={oldPw} onChange={setOldPw} placeholder="Enter your current password" error={errors.oldPw} />
            <PasswordInput label="New Password" value={newPw} onChange={setNewPw} placeholder="Enter your new password" error={errors.newPw} />
            <PasswordInput label="Confirm New Password" value={confirmPw} onChange={setConfirmPw} placeholder="Confirm your new password" error={errors.confirmPw} />
          </div>
          <ul className="reqlist">
            {REQ_ITEMS.map(([k, lbl]) => (
              <li key={k} className={reqs[k] ? "met" : ""}>
                <i className="bi bi-check-lg"></i>{lbl}
              </li>
            ))}
          </ul>
        </div>
        <div className="modal-foot">
          <Button variant="secondary" size="md" onClick={onClose}>Cancel</Button>
          <Button variant="primary" size="md" disabled={!allMet} onClick={submit}>Reset Password</Button>
        </div>
      </div>
    </div>
  );
}

function Toasts({ toasts, dismiss, retry }) {
  return (
    <div className="toast-wrap">
      {toasts.map((t) => (
        <div className={"toast " + t.kind} key={t.id}>
          <i className={"t-ico bi " + (t.kind === "success" ? "bi-check-circle-fill" : "bi-exclamation-circle-fill")}></i>
          <div className="t-body">
            <div className="t-title">{t.title}</div>
            <div className="t-msg">{t.msg}</div>
            <div className="t-links">
              <button className="t-dismiss" onClick={() => dismiss(t.id)}>Dismiss</button>
              {t.kind === "error" ? <button className="t-retry" onClick={() => retry(t.id)}>Try Again</button> : null}
            </div>
          </div>
          <button className="t-x" aria-label="Dismiss" onClick={() => dismiss(t.id)}><i className="bi bi-x-lg"></i></button>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState(() => {
    // Load any profile the user previously saved so it persists across the app.
    try { const s = JSON.parse(localStorage.getItem("ax_profile")); if (s) return s.address ? s : { ...s, address: { addr1: "1234 Main Street", addr2: "", country: "United States", state: "Virginia", city: "Virginia Beach", zip: "12345" } }; } catch (e) {}
    return {
      firstName: "Maria", lastName: "Rodriguez",
      title: "Attorney", company: "Blaine & Associates",
      email: "maria.rodriguez@gmail.com", phone: "(312) 867-5309",
      address: { addr1: "1234 Main Street", addr2: "", country: "United States", state: "Virginia", city: "Virginia Beach", zip: "12345" },
      timezone: "Eastern Time (ET)",
    };
  });
  const [showBanner, setShowBanner] = useState(true);
  const [showPwModal, setShowPwModal] = useState(false);
  const [toasts, setToasts] = useState([]);
  const timers = useRef({});

  useEffect(() => () => Object.values(timers.current).forEach(clearTimeout), []);

  // Persist the profile so the order flow (CreateOrder.html) can prefill from it.
  useEffect(() => {
    try { localStorage.setItem("ax_profile", JSON.stringify(profile)); } catch (e) {}
  }, [profile]);

  const pushToast = (t) => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { ...t, id }]);
    timers.current[id] = setTimeout(() => {
      setToasts((prev) => prev.filter((x) => x.id !== id));
      delete timers.current[id];
    }, 5000);
  };
  const dismiss = (id) => setToasts((prev) => prev.filter((x) => x.id !== id));

  // Hidden trigger: editing first name to "error" simulates a backend failure.
  const saveProfile = (patch) => {
    if (patch.firstName && patch.firstName.trim().toLowerCase() === "error") {
      pushToast({ kind: "error", title: "Problem updating your profile", msg: "We’re having trouble updating your profile. Please try again later." });
      return;
    }
    setProfile((p) => ({ ...p, ...patch }));
    pushToast({ kind: "success", title: "Successfully updated profile", msg: "Your changes have been saved." });
  };

  const saveAddress = (addr) => {
    setProfile((p) => ({ ...p, address: addr }));
    pushToast({ kind: "success", title: "Successfully updated profile", msg: "Your changes have been saved." });
  };

  const hasAddress = !!profile.address;

  return (
    <div>
      <TopBar />
      <main className="page" data-screen-label="My Profile">
        {!hasAddress && showBanner ? (
          <div className="cp-banner">
            <span><b>Complete Your Profile</b> — Add a default address below to speed up future orders.</span>
            <button className="x" aria-label="Dismiss" onClick={() => setShowBanner(false)}><i className="bi bi-x-lg"></i></button>
          </div>
        ) : null}

        <div className="page-title-row">
          <h1 className="page-title">My Profile</h1>
          <Badge color="info" size="md">Organization</Badge>
        </div>
        <p className="page-sub">Manage your account details and settings</p>

        <div className="cols">
          <div className="col">
            <PersonalInfoCard profile={profile} onSave={saveProfile} />
            <div id="address" data-addr-card>
              <AddressCard address={profile.address} onSave={saveAddress} />
            </div>
          </div>
          <div className="col">
            <PreferencesCard profile={profile} onSave={(patch) => setProfile((p) => ({ ...p, ...patch }))} />
            <SecurityCard onChangePassword={() => setShowPwModal(true)} />
          </div>
        </div>
      </main>

      {showPwModal ? (
        <ChangePasswordModal
          onClose={() => setShowPwModal(false)}
          onSuccess={() => { setShowPwModal(false); pushToast({ kind: "success", title: "Successfully updated profile", msg: "Your changes have been saved." }); }}
        />
      ) : null}

      <Toasts toasts={toasts} dismiss={dismiss} retry={(id) => dismiss(id)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
