        <a className="tb-link" href="CreateOrder.html"><i className="bi bi-plus-square"></i><span>Create New Order</span></a>

function DocRow({ name, size, onDone }) {

  const start = () => {
    if (state !== "idle") return;
    setState("busy");
    setTimeout(() => { setState("done"); onDone(name); setTimeout(() => setState("idle"), 2000); }, 1400);
  };
  return (
    <div className={"doc-row " + state}>

function OrderQR({ value, size = 88 }) {
  let svg = "";
  try {
    const q = window.qrcode(0, "M"); q.addData(String(value)); q.make();
    const n = q.getModuleCount(); let p = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += "M" + c + "," + r + "h1v1h-1z";
    svg = '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code for order ' + value + '"><path d="' + p + '" fill="#212529"/></svg>';
  } catch (e) {}
  return <span dangerouslySetInnerHTML={{ __html: svg }}></span>;
}
const BUSY = ["In Process", "Pending Print", "Printed", "Issued", "Flagged"];
const CX_REASONS = ["Ordered by mistake", "Duplicate order", "Incorrect documents", "Incorrect issuing state or service", "No longer needed", "Other"];
function CancelModal({ order, allRows, onKeep, onConfirm }) {
  const isElig = (c) => c.status === "New" || c.status === "Draft";
  const rows = allRows.filter(isElig);
  const blocked = allRows.filter((c) => !isElig(c) && BUSY.includes(c.status)).length;
  const [sel, setSel] = useState(() => new Set());
  const [paperOk, setPaperOk] = useState(false);
  const [reason, setReason] = useState("");
  const [other, setOther] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = () => { if (busy) return; setBusy(true); setTimeout(() => onConfirm(picked.map((c) => c.number)), 1600); };
  const [typed, setTyped] = useState("");
  useEffect(() => { const k = (e) => { if (e.key === "Escape") onKeep(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const isPaper = (c) => /paper/i.test(c.requestType || "");
  const picked = rows.filter((c) => sel.has(c.number));
  const paperN = picked.filter(isPaper).length;
  const all = sel.size === rows.length;
  const toggle = (n) => setSel((s) => { const x = new Set(s); x.has(n) ? x.delete(n) : x.add(n); return x; });
  const ok = picked.length > 0 && (paperN === 0 || paperOk) && reason && (reason !== "Other" || other.trim()) && typed.trim().toLowerCase() === "cancel";
  return (
    <div className="cx-scrim" onMouseDown={(e) => { if (e.target === e.currentTarget && !busy) onKeep(); }}>
      <div className="cx-modal" role="dialog" aria-modal="true" aria-labelledby="cx-t">
        <div className="cx-head"><h2 id="cx-t">Cancel Order #{order.number}</h2><button className="cx-x" onClick={onKeep} aria-label="Close"><i className="bi bi-x-lg"></i></button></div>
        <div className="cx-body">
          <p className="cx-q">Are you sure you want to cancel this order?</p>
          {blocked > 0 ? <div className="cx-warn" role="alert"><i className="bi bi-exclamation-triangle-fill"></i><p>Cancellation is not available for <b>{blocked} child {blocked === 1 ? "order" : "orders"}</b> because {blocked === 1 ? "it is" : "they are"} already being processed. For assistance, please contact the issuing authority’s office.</p></div> : null}
          <div className="cx-list">
            <div className="cx-scroll"><table className="cx-table">
              <thead><tr><th><input className="cx-cb" type="checkbox" disabled={rows.length === 0} checked={all && rows.length > 0} onChange={() => setSel(all ? new Set() : new Set(rows.map((c) => c.number)))} aria-label="Select all" /></th><th>Sub-Order ID #</th><th>Type</th><th>Issuing State</th><th>Service Type</th><th>Status</th></tr></thead>
              <tbody>{allRows.map((c) => { const el = isElig(c); return (
                <tr key={c.number} className={el ? "" : "dis"} onClick={() => el && toggle(c.number)}>
                  <td><input className="cx-cb" type="checkbox" disabled={!el} checked={el && sel.has(c.number)} onChange={() => toggle(c.number)} onClick={(e) => e.stopPropagation()} aria-label={"Select " + c.number} /></td>
                  <td style={{ fontWeight: 700 }}>#{c.number}</td><td>{isPaper(c) ? "Paper" : "Digital"}</td><td>{c.issuingState}</td><td>{c.serviceType}</td>
                  <td><span className={"sbadge " + AXOrders.universalClass(c.status)}>{AXOrders.universalLabel(c.status === "Draft" ? "New" : c.status)}</span></td>
                </tr>); })}</tbody>
            </table></div>
            <div className="cx-foot-sel"><span className="cx-count">{picked.length}</span><span style={{ flex: 1 }}>Document(s) selected</span><button className="cx-lnk" onClick={() => setSel(new Set(rows.map((c) => c.number)))}>Select All</button><button className="cx-lnk" onClick={() => setSel(new Set())}><i className="bi bi-x-lg"></i> Clear Selection</button></div>
          </div>
          {paperN > 0 ? (
            <label className="cx-paper"><input className="cx-cb" type="checkbox" checked={paperOk} onChange={(e) => setPaperOk(e.target.checked)} />
              <span><b>I confirm that the {paperN} paper document{paperN === 1 ? "" : "s"} in this selection {paperN === 1 ? "has" : "have"} not been sent to the issuing authority. <span className="req">*</span></b><p>Required before paper sub-orders can be canceled. If the documents have already been sent, the order cannot be canceled online — please contact the issuing authority’s office for assistance.</p></span></label>
          ) : null}
          <div className="cx-f"><label htmlFor="cx-r">Reason <span className="req">*</span></label>
            <select id="cx-r" className="cx-in" value={reason} onChange={(e) => setReason(e.target.value)}><option value="">Select Reason</option>{CX_REASONS.map((r) => <option key={r}>{r}</option>)}</select>{reason === "Other" ? <div style={{ marginTop: "var(--ax-space-3)" }}><label htmlFor="cx-o">Please tell us why <span className="req">*</span></label><textarea id="cx-o" className="cx-in" style={{ height: "5.5rem", padding: "0.625rem 0.875rem", resize: "vertical" }} maxLength={250} placeholder="Enter your reason" value={other} onChange={(e) => setOther(e.target.value)} autoFocus></textarea></div> : null}</div>
          <div className="cx-f"><label htmlFor="cx-c">Type “Cancel” to confirm <span className="req">*</span></label>
            <input id="cx-c" className="cx-in" placeholder="Type “Cancel”" value={typed} onChange={(e) => setTyped(e.target.value)} autoComplete="off" /></div>
        </div>
        <div className="cx-foot"><button className="cx-btn" disabled={busy} onClick={onKeep}>Keep Order</button><button className={"cx-btn danger" + (busy ? " busy" : "")} disabled={!ok && !busy} aria-busy={busy} onClick={submit}>{busy ? <React.Fragment><span className="cx-spin"></span>Canceling…</React.Fragment> : "Confirm Cancellation"}</button></div>
      </div>
    </div>
  );
}
function App() {
  const params = new URLSearchParams(window.location.search);

  const parentStatus = AXOrders.parentStatus(order.children);
  const cxRows = order.children.filter((c) => c.status === "New" || c.status === "Draft");
  const canCancel = cxRows.length > 0;
  const noCancelBanner = !canCancel && order.children.some((c) => ["In Process", "Pending Print", "Printed", "Issued", "Flagged"].includes(c.status));
  useEffect(() => { if (!cxToast) return; const t = setTimeout(() => setCxToast(null), 6000); return () => clearTimeout(t); }, [cxToast]);
  const goChild = (number) => { window.location.href = "OrderDetails.html?order=" + encodeURIComponent(number); };

  const [sort, setSort] = useState({ key: null, dir: 1 });
  const [toast, setToast] = useState(null);
  const [qrOpen, setQrOpen] = useState(false);
  useEffect(() => { if (!qrOpen) return; const k = (e) => { if (e.key === "Escape") setQrOpen(false); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [qrOpen]);
  const paperCount = (order.children || []).filter((c) => /paper/i.test(c.requestType || "")).length;
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 6000);
    return () => clearTimeout(t);
  }, [toast]);
  const COLS = [
    { key: "number", label: "Order Number", get: (c) => c.number },
    { key: "issuingState", label: "Issuing State", get: (c) => c.issuingState },
    { key: "requestType", label: "Request Type", get: (c) => c.requestType },
    { key: "serviceType", label: "Service Type", get: (c) => c.serviceType },
    { key: "referenceName", label: "Reference Name", get: (c) => c.referenceName || "—" },
    { key: "status", label: "Status", get: (c) => AXOrders.universalLabel(c.status) },
  ];
  const toggleSort = (key) => setSort((s) => (s.key === key ? { key, dir: -s.dir } : { key, dir: 1 }));
  const sortedChildren = React.useMemo(() => {
    if (!sort.key) return order.children;
    const col = COLS.find((c) => c.key === sort.key);
    return order.children.slice().sort((a, b) => {
      const av = String(col.get(a) == null ? "" : col.get(a));
      const bv = String(col.get(b) == null ? "" : col.get(b));
      return av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" }) * sort.dir;
    });
  }, [order.children, sort]);

  const isWalkIn = order.orderOption === "walkin";
  const mixedWalk = order.orderOption === "mixed" && (order.children || []).some((c) => c.status === "Draft");
  const showQR = isWalkIn || mixedWalk || paperCount > 0;
  const formCount = isWalkIn ? Math.max((order.children || []).length, 1) : paperCount;
  const wiBanner = isWalkIn || mixedWalk ? AXOrders.banner({ status: "Draft", deliveryFlow: ((order.children || [])[0] || {}).deliveryFlow }) : null;
  const qrCap = isWalkIn || mixedWalk ? "Show this code at your appointment" : "Include with your documents";
  return (
    <div>

        </div></div>

        </div>
        {(isWalkIn || mixedWalk) && wiBanner ? <div className="wi-banner"><i className="bi bi-info-circle-fill"></i><div><p className="wb-t">{wiBanner.title}</p><p className="wb-b">{wiBanner.body}</p></div></div> : null}

        {noCancelBanner ? <div className="cx-pagebanner" role="status"><i className="bi bi-exclamation-triangle-fill"></i><p><b>Cancellation is no longer available</b> — All requests in this order are already being processed and can no longer be canceled online. For assistance, please contact the issuing authority’s office.</p></div> : null}

                  </tr>

            </table>

        </div>
      </main>

      {cxToast ? <div style={{ position: "fixed", top: "5.5rem", right: "1.75rem", zIndex: 250, width: "25rem", maxWidth: "calc(100vw - 2rem)" }}><window.ApostilleXpressDesignSystem_141fbe.Toast kind="success" title={cxToast.n + (cxToast.n === 1 ? " request" : " requests") + " canceled successfully"} onClose={() => setCxToast(null)} style={{ width: "100%" }} action={<button onClick={() => setCxToast(null)} style={{ background: "none", border: "none", padding: 0, fontFamily: "inherit", fontSize: "var(--ax-text-sm)", fontWeight: 700, color: "var(--ax-text-primary)", cursor: "pointer" }}>Dismiss</button>}>{cxToast.unpaid ? "No payment was made for this order, so no refund applies. A confirmation email has been sent to you." : <>A full refund of <b>{cxToast.refund}</b> has been initiated and a confirmation email has been sent to you.</>}</window.ApostilleXpressDesignSystem_141fbe.Toast></div> : null}
      {toast ? (
        <div className="dl-toast">
          <i className="bi bi-check-circle tk"></i>

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
