<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — ApostilleXpress</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="./ds-base.js"></script>
<script src="./geoData.js"></script>
<script src="./teamData.js"></script>
<link rel="stylesheet" href="ax-overlays.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}
a{color:var(--ax-sea-depths)}a:hover{color:var(--ax-teal-700)}
/* ---- Top bar (shared) ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:36px;height:72px;padding:0 40px;background:var(--ax-surface-card);border-bottom:1px solid var(--ax-border-subtle)}
.tb-logo{display:flex;align-items:center;flex-shrink:0}
.tb-nav{display:flex;align-items:center;gap:28px;flex:1}
.tb-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ax-text-tertiary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;transition:color .15s ease}
.tb-link i{font-size:18px}
.tb-link:hover,.tb-link.active{color:var(--ax-gray-700,#414651)}.tb-link,.tb-link:hover,.tb-link:focus{text-decoration:none}.tb-link.active{font-weight:600}.tb-link,.tb-link:focus,.tb-link:focus-visible,.tb-link.active{outline:none;box-shadow:none;border:none}
.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-100)}
.tb-profile-btn i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:var(--ax-shadow-md,0 12px 24px -8px rgba(10,13,18,.18));padding:8px;z-index:40}
.tb-menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:8px;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s ease}
.tb-menu-item:hover{background:var(--ax-gray-100)}
.tb-menu-item i{font-size:18px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.tb-menu-sep{border:none;border-top:1px solid var(--ax-border-subtle);margin:6px 6px}
/* ---- Page ---- */
.page{max-width:none;margin:0 165px;padding:38px 40px 60px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}
.page-title{font-size:24px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.page-sub{font-size:16px;color:var(--ax-text-tertiary);margin:8px 0 0}
.btn-primary{display:inline-flex;align-items:center;gap:10px;background:var(--ax-sea-depths);color:#fff;border:none;border-radius:8px;padding:13px 22px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--ax-shadow-xs);transition:background .15s ease}
.btn-primary:hover{background:var(--ax-teal-700)}
.btn-primary:active{transform:translateY(.5px)}
.btn-primary:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.btn-sec{display:inline-flex;align-items:center;gap:8px;background:var(--ax-surface-card);color:var(--ax-text-primary);border:1px solid var(--ax-border);border-radius:8px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--ax-shadow-xs);transition:background .12s ease,border-color .12s ease}
.btn-sec:hover{background:var(--ax-gray-100);border-color:var(--ax-border-strong)}
.btn-sec:active{transform:translateY(.5px)}
.btn-sec:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.btn-sec:disabled{opacity:.55;cursor:not-allowed}
.btn-sec.danger{color:var(--ax-danger-600);border-color:var(--ax-danger-200,#f3c9c6)}
.btn-sec.danger:hover{background:var(--ax-danger-50);border-color:var(--ax-danger-600)}
.btn-danger{display:inline-flex;align-items:center;gap:8px;background:var(--ax-danger-600);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--ax-shadow-xs);transition:background .15s ease}
.btn-danger:hover{background:var(--ax-danger-700)}
/* ---- Tabs (segmented, matches product nav pattern) ---- */
.tabs{display:inline-flex;align-items:center;gap:2px;background:var(--ax-gray-100);border:1px solid var(--ax-border-subtle);border-radius:10px;padding:4px;margin-bottom:22px}
.tab{display:inline-flex;align-items:center;gap:7px;background:none;border:none;border-radius:7px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-text-tertiary);padding:7px 14px;cursor:pointer;white-space:nowrap;transition:color .12s ease,background .12s ease,box-shadow .12s ease}
.tab:hover{color:var(--ax-text-primary);background:rgba(255,255,255,.7)}
.tab.on{color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs)}
.tab:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.tab .tcount{font-size:12px;font-weight:600;line-height:1;color:var(--ax-text-tertiary);background:var(--ax-gray-100);border:1px solid var(--ax-border-subtle);border-radius:999px;min-width:20px;padding:3px 6px;text-align:center}
.tab.on .tcount{background:var(--ax-info-50);border-color:transparent;color:var(--ax-sea-depths)}
/* ---- Cards (My Team) ---- */
.cards{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
.card{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:var(--ax-shadow-xs);padding:20px 22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.card-head h2{font-size:17px;font-weight:700;margin:0;line-height:1.25}
.card-head p{font-size:14px;color:var(--ax-text-tertiary);margin:4px 0 0;line-height:1.4}
.divider{border:none;border-top:1px solid var(--ax-border-subtle);margin:16px 0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.ro-label{font-size:13px;color:var(--ax-text-tertiary);margin-bottom:3px}
.ro-value{font-size:16px;font-weight:600;color:var(--ax-text-primary);line-height:1.35;display:flex;align-items:center;gap:8px}
.ro-value .sub{font-size:14px;font-weight:400;color:var(--ax-text-tertiary)}
.perm-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px}
.perm-list li{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--ax-text-secondary);line-height:1.4}
.perm-list i{color:var(--ax-success-600,#1F945C);font-size:15px;margin-top:1px;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{display:flex;align-items:center;gap:14px;border:1px solid var(--ax-border-subtle);border-radius:12px;padding:16px 18px;background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);text-align:left;font-family:inherit;width:100%;transition:border-color .12s ease,background .12s ease}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--ax-border-strong);background:var(--ax-gray-100)}
button.stat:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.stat .st-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat .st-num{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .st-lbl{font-size:13px;color:var(--ax-text-tertiary);margin-top:2px}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ax-text-tertiary);margin:0 0 12px}
.icard{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:var(--ax-shadow-xs);overflow:hidden}
.icard-head{padding:18px 24px}
.icard-head h2{font-size:19px;font-weight:700;margin:0;line-height:1.25}
.irow{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 24px;border-top:1px solid var(--ax-border-subtle);font-size:15px;transition:background .12s ease}
.irow:hover{background:var(--ax-gray-100)}
.irow .k{color:var(--ax-text-secondary)}
.irow .v{font-weight:600;color:var(--ax-text-primary);text-align:right}
.irow .v.num{font-variant-numeric:tabular-nums}
.spill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px;flex-shrink:0}
.ic-teal{background:var(--ax-info-50);color:var(--ax-sea-depths)}
.ic-warn{background:var(--ax-warning-50);color:var(--ax-warning-700)}
.ic-blue{background:var(--ax-info-50);color:var(--ax-info-700)}
.ic-green{background:var(--ax-success-50);color:var(--ax-success-700)}
/* ---- Toolbar ---- */
.sec-head{margin-bottom:16px}
.sec-head h2{font-size:22px;font-weight:700;margin:0;line-height:1.25}
.sec-head p{font-size:15px;color:var(--ax-text-tertiary);margin:5px 0 0}
.tcard-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 30px 18px}
.tcard-title{display:inline-flex;align-items:center;gap:12px;font-size:19px;font-weight:700}
.tcard-tools{display:flex;align-items:center;gap:12px;margin-left:auto}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.searchbox{position:relative;flex:1;min-width:240px;max-width:380px}.searchbox i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ax-text-tertiary);font-size:16px;pointer-events:none}
.searchbox input{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:11px 14px 11px 40px;font-family:inherit;font-size:15px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.searchbox input:hover{border-color:var(--ax-border-strong)}
.searchbox input:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.searchbox input::placeholder{color:var(--ax-text-placeholder)}
.selwrap{position:relative}
.selwrap select{-webkit-appearance:none;appearance:none;border:1px solid var(--ax-border);border-radius:8px;padding:11px 38px 11px 14px;font-family:inherit;font-size:15px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);cursor:pointer;outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.selwrap select:hover{border-color:var(--ax-border-strong)}
.selwrap select:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.selwrap > i{position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ax-text-tertiary);font-size:13px}
/* ---- Table (shared with Orders) ---- */
.tcard{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:var(--ax-shadow-xs);overflow:visible}
.tscroll{overflow-x:auto}
.otable{width:100%;border-collapse:collapse;min-width:900px}
.otable th{text-align:left;font-size:16px;font-weight:600;color:var(--ax-text-primary);padding:22px 18px 18px;border-bottom:1px solid var(--ax-border-subtle);white-space:nowrap}
.otable th:first-child,.otable td:first-child{padding-left:30px}
.otable th:last-child,.otable td:last-child{padding-right:30px}
.th-inner{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.th-inner .bi{font-size:15px;color:var(--ax-text-tertiary)}
.th-inner .bi.on{color:var(--ax-sea-depths)}
.otable td{font-size:16px;color:var(--ax-text-primary);padding:15px 18px;border-bottom:1px solid var(--ax-border-subtle);white-space:nowrap;vertical-align:middle}
.otable tbody tr:last-child td{border-bottom:none}
.otable tbody tr{transition:background .12s ease}
.otable tbody tr:hover{background:var(--ax-gray-100)}
.otable tbody tr.crow{cursor:pointer}
.col-actions{text-align:right}
.uname{font-size:16px;font-weight:600;line-height:1.3}
.uname .youtag{font-size:12px;font-weight:700;color:var(--ax-sea-depths);background:var(--ax-info-50);border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:1px}
.uemail{font-size:14px;color:var(--ax-text-tertiary);margin-top:2px}
.utitle{font-size:16px;line-height:1.3}
.urole{font-size:14px;color:var(--ax-text-tertiary);margin-top:2px}
.dim{color:var(--ax-text-tertiary)}
.spill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap}
.spill.issued{background:var(--ax-success-50);color:var(--ax-success-700)}
.spill.pending{background:var(--ax-warning-50);color:var(--ax-warning-700)}
.spill.cancelled{background:var(--ax-danger-50);color:#DB3A33;border:1px solid #FECDCA}
.spill.inactive{background:#FEF3F2;color:#B42318;border:1px solid #FECDCAEB}
.spill.perm-admin{background:var(--ax-info-50);color:var(--ax-sea-depths)}
.spill.perm-manager{background:var(--ax-info-50);color:var(--ax-info-700)}
.spill.perm-standard{background:var(--ax-gray-100);color:var(--ax-text-secondary)}
.spill.perm-viewer{background:var(--ax-gray-100);color:var(--ax-text-tertiary)}
/* ---- Kebab ---- */
.kwrap{position:relative;display:inline-flex}
.kbtn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ax-text-tertiary);font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s ease,color .12s ease}
.kbtn:hover{background:var(--ax-gray-100);color:var(--ax-text-primary)}
.kbtn[aria-expanded="true"]{background:var(--ax-gray-100);color:var(--ax-text-primary)}
.kbtn:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.kmenu{position:fixed;min-width:196px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:10px;box-shadow:var(--ax-shadow-md,0 12px 24px -8px rgba(10,13,18,.18));padding:6px;z-index:50;text-align:left}
.kitem{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;font-family:inherit;font-size:15px;color:var(--ax-text-primary);padding:10px 13px;border-radius:7px;cursor:pointer;text-align:left;transition:background .12s ease}
.kitem i{font-size:16px;color:var(--ax-text-tertiary);width:18px}
.kitem:hover{background:var(--ax-gray-100)}
.kitem.danger{color:var(--ax-danger-600)}
.kitem.danger i{color:var(--ax-danger-600)}
.kitem:disabled{opacity:.45;cursor:not-allowed}
.ksep{height:1px;background:var(--ax-border-subtle);margin:5px 8px}
.rowacts{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
/* ---- States ---- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:64px 24px;text-align:center}
.state-row{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--ax-text-secondary)}
.spin{width:22px;height:22px;border:2.5px solid var(--ax-gray-200);border-top-color:var(--ax-sea-depths);border-radius:50%;animation:axspin .7s linear infinite;flex-shrink:0}
.spin.sm{width:15px;height:15px;border-width:2px}
@keyframes axspin{to{transform:rotate(360deg)}}
.empty-ic{width:64px;height:64px;border-radius:50%;background:var(--ax-gray-100);color:var(--ax-text-tertiary);display:flex;align-items:center;justify-content:center;font-size:30px}
.empty-ic.err{background:var(--ax-danger-50);color:var(--ax-danger-600)}
.empty-title{font-size:20px;font-weight:600;color:var(--ax-text-primary)}
.empty-sub{font-size:15px;color:var(--ax-text-tertiary);margin-top:-6px;max-width:420px}
.sk{display:block;height:14px;border-radius:5px;background:linear-gradient(90deg,var(--ax-gray-100) 25%,var(--ax-gray-200) 37%,var(--ax-gray-100) 63%);background-size:400% 100%;animation:sksh 1.4s ease infinite}
@keyframes sksh{0%{background-position:100% 50%}100%{background-position:0% 50%}}
/* ---- Footer / pagination ---- */
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 30px;border-top:1px solid var(--ax-border-subtle)}
.tfoot-total{font-size:15px;color:var(--ax-text-secondary)}
.pager{display:flex;align-items:center;border:1px solid var(--ax-border);border-radius:8px;overflow:hidden}
.pgbtn{min-width:42px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:var(--ax-surface-card);border:none;border-right:1px solid var(--ax-border);font-family:inherit;font-size:15px;color:var(--ax-text-secondary);cursor:pointer;padding:0 6px;transition:background .12s ease}
.pgbtn:last-child{border-right:none}
.pgbtn:hover:not(:disabled):not(.dots){background:var(--ax-gray-100)}
.pgbtn.active{background:var(--ax-gray-100);color:var(--ax-text-primary);font-weight:600}
.pgbtn.dots{cursor:default;color:var(--ax-text-tertiary)}
.pgbtn:disabled{color:var(--ax-gray-400);cursor:not-allowed}
.perpage{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ax-text-secondary)}
.perpage select{font-family:inherit;font-size:15px;color:var(--ax-text-primary);border:1px solid var(--ax-border);border-radius:8px;padding:9px 12px;background:var(--ax-surface-card);cursor:pointer}









.field{display:flex;flex-direction:column;margin-bottom:18px}
.field:last-child{margin-bottom:0}
.flabel{font-size:15px;font-weight:500;color:var(--ax-text-primary);margin-bottom:7px}
.req{color:var(--ax-danger-600)}
.tinput{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.tinput:hover{border-color:var(--ax-border-strong)}
.tinput:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tinput.err{border-color:var(--ax-border-error)}
.tselect{width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--ax-border);border-radius:8px;padding:12px 40px 12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;cursor:pointer}
.tselect:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tselect-wrap{position:relative}
.tselect-wrap > i{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ax-text-tertiary);font-size:14px}
.field-err{font-size:14px;color:var(--ax-text-error);margin-top:6px}
.permsel{position:relative}
.permsel-btn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--ax-border);border-radius:8px;background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);padding:12px 14px;font-family:inherit;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.permsel-btn:hover{border-color:var(--ax-border-strong)}
.permsel-btn[aria-expanded="true"],.permsel-btn:focus-visible{outline:none;border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.permsel-btn.err{border-color:var(--ax-border-error)}
.permsel-btn .pt{flex:1;min-width:0}
.permsel-btn .pt-name{font-size:16px;font-weight:600;color:var(--ax-text-primary);display:flex;align-items:center;gap:9px}
.permsel-btn.empty .pt-name{font-weight:500;color:var(--ax-text-placeholder)}
.permsel-btn .pt-sub{font-size:14px;color:var(--ax-text-tertiary);margin-top:2px;line-height:1.4}

/* ---------- primitives reused by both tables ---------- */
function SortTh({ label, k, sort, setSort, className }) {
  const on = sort.key === k;
  const icon = "bi " + (on ? (sort.dir === 1 ? "bi-chevron-up on" : "bi-chevron-down on") : "bi-chevron-expand");
  return (
    <th className={className} onClick={() => setSort((p) => ({ key: k, dir: p.key === k ? -p.dir : 1 }))}>
      <span className="th-inner">{label} <i className={icon}></i></span>
    </th>
  );
}
function Pager({ total, page, setPage, perPage, setPerPage }) {
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  const cur = Math.min(page, totalPages);
  const mk = (n) => ({ n, cls: n === cur ? "active" : "" });
  let pages = [];
  if (totalPages <= 9) { for (let i = 1; i <= totalPages; i++) pages.push(mk(i)); }
  else {
    const mid = []; for (let i = Math.max(2, cur - 2); i <= Math.min(totalPages - 1, cur + 2); i++) mid.push(i);
    pages = [mk(1)];
    if (mid[0] > 2) pages.push({ dots: true });
    mid.forEach((n) => pages.push(mk(n)));
    if (mid[mid.length - 1] < totalPages - 1) pages.push({ dots: true });
    pages.push(mk(totalPages));
  }
  return (
    <div className="tfoot">
      <span className="tfoot-total">Total {total} items</span>
      <div className="pager" role="navigation" aria-label="Pagination">
        <button className="pgbtn" onClick={() => setPage(1)} disabled={cur === 1} aria-label="First page"><i className="bi bi-chevron-bar-left"></i></button>
        <button className="pgbtn" onClick={() => setPage(Math.max(1, cur - 1))} disabled={cur === 1} aria-label="Previous page"><i className="bi bi-chevron-left"></i></button>
        {pages.map((p, i) => p.dots
          ? <button className="pgbtn dots" key={"d" + i} disabled>…</button>
          : <button className={"pgbtn " + p.cls} key={p.n} onClick={() => setPage(p.n)}>{p.n}</button>)}
        <button className="pgbtn" onClick={() => setPage(Math.min(totalPages, cur + 1))} disabled={cur === totalPages} aria-label="Next page"><i className="bi bi-chevron-right"></i></button>
        <button className="pgbtn" onClick={() => setPage(totalPages)} disabled={cur === totalPages} aria-label="Last page"><i className="bi bi-chevron-bar-right"></i></button>
      </div>
      <div className="perpage">
        <span>Items per page</span>
        <select value={String(perPage)} onChange={(e) => { setPerPage(parseInt(e.target.value, 10)); setPage(1); }}>
          <option value="10">10</option><option value="20">20</option><option value="50">50</option>
        </select>
      </div>
    </div>
  );
}
function Kebab({ items }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  const btnRef = useRef(null);
  // The menu is portalled to <body> with fixed coordinates so the table's
  // horizontal scroll container can never clip it, and flips up near the
  // bottom of the viewport.
  const place = () => {
    const b = btnRef.current;
    if (!b) return;
    const r = b.getBoundingClientRect();
    const h = 6 + items.length * 40;
    const below = window.innerHeight - r.bottom;
    setPos({ left: Math.max(12, r.right - 196), top: below < h + 16 ? Math.max(12, r.top - h - 6) : r.bottom + 6 });
  };
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target) && !(e.target.closest && e.target.closest(".kmenu"))) setOpen(false); };
    const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
    const onMove = () => setOpen(false);
    document.addEventListener("mousedown", onDoc); document.addEventListener("keydown", onEsc);
    window.addEventListener("scroll", onMove, true); window.addEventListener("resize", onMove);
    return () => {
      document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onEsc);
      window.removeEventListener("scroll", onMove, true); window.removeEventListener("resize", onMove);
    };
  }, [open]);
  return (
    <div className="kwrap" ref={ref}>
      <button className="kbtn" ref={btnRef} aria-label="Actions" aria-haspopup="menu" aria-expanded={open} onClick={() => { if (!open) place(); setOpen((o) => !o); }}><i className="bi bi-three-dots-vertical"></i></button>
      {open && pos ? ReactDOM.createPortal((
        <div className="kmenu" role="menu" style={{ left: pos.left, top: pos.top }}>
          {items.map((it, i) => it.sep
            ? <div className="ksep" key={"s" + i}></div>
            : <button key={it.label} className={"kitem" + (it.danger ? " danger" : "")} role="menuitem" disabled={it.disabled}
                onClick={() => { setOpen(false); it.onClick(); }}><i className={"bi " + it.icon}></i>{it.label}</button>)}
        </div>
      ), document.body) : null}
    </div>
  );
}
function SkeletonRows({ cols, rows }) {
  const widths = ["180px", "110px", "150px", "96px", "76px", "36px"];
  return (
    <tbody>
      {Array.from({ length: rows }).map((_, r) => (
        <tr key={r}>{Array.from({ length: cols }).map((__, c) => (
          <td key={c}><span className="sk" style={{ width: widths[c % widths.length], marginLeft: c === cols - 1 ? "auto" : 0 }}></span></td>
        ))}</tr>
      ))}
    </tbody>
  );
}
function TableState({ kind, onRetry, onInvite, query }) {

  const [page, setPage] = useState(1);
  const [perPage, setPerPage] = useState(10);

  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    let rows = members.filter((m) => {
      if (m.status === "Revoked") return false;
      if (perm !== "All" && m.perm !== perm) return false;
      if (status !== "All" && m.status !== status) return false;
      if (!needle) return true;
      return (m.first + " " + m.last + " " + m.email + " " + m.title).toLowerCase().includes(needle);
    });
    const get = {
      name: (m) => m.last + m.first, perm: (m) => m.perm, title: (m) => m.title,
      last: (m) => (m.lastActive ? Date.parse(m.lastActive) : 0), status: (m) => m.status,
    }[sort.key];
    if (get) rows = rows.slice().sort((a, b) => {
      const av = get(a), bv = get(b);
      const c = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv), undefined, { sensitivity: "base" });
      return c * sort.dir;
    });
    return rows;
  }, [members, q, perm, status, sort]);

  const cur = Math.min(page, Math.max(1, Math.ceil(filtered.length / perPage)));

      if (can("removeUser") && !m.you) items.push({ label: "Remove User", icon: "bi-trash", danger: true, onClick: () => onRemoveUser(m) });

  return (

function Invitations({ invites, setInvites, load, reload, toast, onInvite, confirm, can, resend, revoke, busy, openProfile }) {

  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    let rows = invites.filter((i) => !needle || (i.email + " " + i.by + " " + i.perm).toLowerCase().includes(needle));
    const get = { email: (i) => i.email, perm: (i) => i.perm, by: (i) => i.by, activity: (i) => Date.parse(i.activity) || 0, status: (i) => i.status }[sort.key];
    if (get) rows = rows.slice().sort((a, b) => {
      const av = get(a), bv = get(b);
      const c = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv), undefined, { sensitivity: "base" });
      return c * sort.dir;
    });
    return rows;
  }, [invites, q, sort]);

  const cur = Math.min(page, Math.max(1, Math.ceil(filtered.length / perPage)));

function Modal({ title, sub, onClose, children, foot, wide }) {
  useEffect(() => {
    const onEsc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onEsc);
    return () => document.removeEventListener("keydown", onEsc);
  }, [onClose]);
  return (
    <div className="scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={title} style={wide ? { maxWidth: 620 } : null}>
        <div className="modal-head">
          <div><h2>{title}</h2>{sub ? <p>{sub}</p> : null}</div>
          <button className="modal-x" aria-label="Close" onClick={onClose}><i className="bi bi-x-lg"></i></button>
        </div>
        <div className="modal-body">{children}</div>
        <div className="modal-foot">{foot}</div>
      </div>
    </div>
  );
}
function PermissionSelect({ value, onChange, seatsLeft, error, onBlur, withDesc }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  // Portalled to <body> with fixed coordinates so the modal body's scroll
  // container never clips it and the menu never changes the modal's height.
  const place = () => {
    const b = ref.current;
    if (!b) return;
    const r = b.getBoundingClientRect();
    const w = Math.max(r.width, 340);
    setPos({ left: Math.max(12, Math.min(r.left, window.innerWidth - w - 12)), width: w, top: r.bottom + 8, maxHeight: Math.max(200, window.innerHeight - r.bottom - 24) });
  };
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (ref.current && ref.current.contains(e.target)) return;
      if (e.target.closest && e.target.closest(".permsel-list")) return;
      setOpen(false); onBlur && onBlur();
    };
    const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
    const onMove = () => place();
    document.addEventListener("mousedown", onDoc); document.addEventListener("keydown", onEsc);
    window.addEventListener("scroll", onMove, true); window.addEventListener("resize", onMove);
    return () => {
      document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onEsc);
      window.removeEventListener("scroll", onMove, true); window.removeEventListener("resize", onMove);
    };
  }, [open]);
  const badge = (p) => {
    if (p === "Administrator") return <span className={"spill " + (seatsLeft > 0 ? "seat" : "cancelled")}>{T.seatLabel(seatsLeft)}</span>;
    if (p === "Viewer") return <span className="spill ro">Read-only</span>;
    return null;
  };
  return (
    <div className="permsel" ref={ref}>
      <button type="button" className={"permsel-btn" + (value ? "" : " empty") + (error ? " err" : "")} aria-haspopup="listbox" aria-expanded={open}
        onClick={() => { if (!open) place(); setOpen((o) => !o); }}>
        <span className="pt">
          <span className="pt-name">{value || "Select a permission level"}{value ? badge(value) : null}</span>
          {value ? (withDesc ? <span className="pt-sub">{T.PERM_SUMMARY[value]}</span> : null) : <span className="pt-sub">Controls what this user can see and do</span>}
        </span>
        <i className="bi bi-chevron-down"></i>
      </button>
      {open && pos ? ReactDOM.createPortal((
        <div className="permsel-list" role="listbox" style={{ left: pos.left, top: pos.top, width: pos.width, maxHeight: pos.maxHeight }}>
          {T.PERMS.map((p) => {
            const off = p === "Administrator" && seatsLeft <= 0;
            return (
              <button type="button" key={p} role="option" aria-selected={value === p} disabled={off}
                className={"permopt" + (value === p ? " on" : "")}
                onClick={() => { onChange(p); setOpen(false); onBlur && onBlur(); }}>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span className="po-name">{p}{badge(p)}</span>
                  {withDesc ? <span className="po-desc" style={{ display: "block" }}>{T.PERM_SUMMARY[p]}</span> : null}
                </span>
                <i className="bi bi-check-lg po-check"></i>
              </button>
            );
          })}
        </div>
      ), document.body) : null}
    </div>
  );
}

  const mark = (k) => setTouched((p) => ({ ...p, [k]: true }));
  const email = f.email.trim();
  const errs = {
    email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : "Enter a valid email address.",
    first: f.first.trim() ? "" : "Enter the user's first name.",

  };

      const t = e.target, tag = (t && t.tagName || "").toLowerCase();

  const doResend = (inv) => {
    setBusy(inv.id);
    setTimeout(() => {
      setBusy(null);
      setInvites((list) => list.map((x) => x.id === inv.id ? { ...x, activity: new Date().toISOString(), status: "Pending" } : x));
      setMembers((list) => list.map((m) => m.email === inv.email && (m.status === "Revoked" || m.status === "Invite Expired") ? { ...m, status: "Pending" } : m));
      toast("ok", "Invitation resent", <React.Fragment>A new invitation link was sent to <b>{inv.email}</b>.</React.Fragment>,
        [{ label: "Dismiss", plain: true }, { label: "View Profile", onClick: () => openInviteProfile(inv.id) }]);
    }, 900);
  };
  const resend = (inv) => {
    if (!can("resendInvitation") || !inv) return;
    setConfirmCfg({
      title: "Resend Invitation?",
      body: <React.Fragment>A new invitation will be sent to <b>{inv.email}</b>.</React.Fragment>,
      cta: "Resend Invitation", cancel: "Cancel",
      run: () => doResend(inv),
    });
  };
  const revoke = (inv) => {
    if (!can("revokeInvitation") || !inv) return;
    setConfirmCfg({
      title: "Revoke Invitation?",
      body: <React.Fragment>The pending invitation for <b>{inv.email}</b> will be revoked. They will no longer be able to accept it.</React.Fragment>,
      cta: "Revoke Invitation", cancel: "Keep Invitation", danger: true,
      run: () => {
        setInvites((list) => list.map((x) => x.id === inv.id ? { ...x, status: "Revoked", activity: new Date().toISOString() } : x));
        setMembers((list) => list.map((m) => m.email === inv.email && m.status === "Pending" ? { ...m, status: "Revoked" } : m));
        toast("ok", "Invitation was revoked", <React.Fragment><b>{inv.email}</b> will not be added to your team.</React.Fragment>, [{ label: "Dismiss", plain: true }]);
      },
    });
  };
  const byEmail = (email) => invites.find((i) => i.email === email);

  // Remove User — Administrators only. Removal is reversible via Undo, which
  // restores the record (and its administrator seat) exactly as it was.
  const undoRemove = (snap) => {
    setMembers((l) => {
      const next = l.slice();
      next.splice(Math.min(snap.index, next.length), 0, snap.user);
      return next;
    });
    setRemoved(null);
    setProfileId(snap.user.id);
    toTop();
    toast("ok", "User restored", <React.Fragment><b>{(snap.user.first + " " + snap.user.last).trim()}</b> has been added back to the organization.</React.Fragment>, [{ label: "Dismiss", plain: true }]);
  };
  const doRemove = (m, fromProfile) => {
    if (!can("removeUser")) return;
    const index = members.findIndex((x) => x.id === m.id);
    if (index < 0) return;
    const snap = { user: m, index };
    setMembers((l) => l.filter((x) => x.id !== m.id));
    const full = (m.first + " " + m.last).trim();
    if (fromProfile) { setRemoved(snap); return; }
    setProfileId(null);
    toast("ok", full + " was removed", <React.Fragment>They no longer have access to ApostilleXpress. You can undo this action or re-invite them at any time.</React.Fragment>,
      [{ label: "Undo", onClick: () => undoRemove(snap) }, { label: "Dismiss", plain: true }]);
  };

  const pendingCount = invites.filter((i) => i.status === "Pending").length;
  const roster = members.filter((m) => m.status !== "Revoked");
  const seatsLeft = Math.max(0, T.MAX_ADMIN_SEATS - T.adminSeatsUsed(roster, invites));
  const knownEmails = members.map((m) => m.email.toLowerCase()).concat(invites.filter((i) => i.status === "Pending").map((i) => i.email.toLowerCase()));

  const sendInvite = ({ email, first, last, perm }) => {
    setInvite(false);
    const inviteId = "i" + Date.now(), memberId = "u" + Date.now();
    setInvites((l) => [{ id: inviteId, email, perm, by: "Maria Rodriguez", activity: new Date().toISOString(), status: "Pending" }, ...l]);
    setMembers((l) => [...l, { id: memberId, first, last, email, perm, title: "—", role: "Member", lastActive: null, status: "Pending" }]);
    toast("ok", "Invitation sent", <React.Fragment>We emailed an invitation to <b>{email}</b>. It expires in 7 days.</React.Fragment>,
      [{ label: "Dismiss", plain: true }, { label: "View Profile", onClick: () => openInviteProfile(inviteId) }]);
  };

  // An invitation profile reuses the member record when one exists, and is
  // otherwise derived from the invitation itself so it always reflects status.
  const inviteUser = (() => {
    if (!inviteProfileId) return null;
    const inv = invites.find((i) => i.id === inviteProfileId);
    if (!inv) return null;
    const m = members.find((x) => x.email === inv.email);
    if (m) return { ...m, perm: inv.perm, status: inv.status === "Revoked" ? "Revoked" : m.status };
    const local = inv.email.split("@")[0].split(/[._-]/);
    const cap = (w) => (w ? w[0].toUpperCase() + w.slice(1) : "");
    return { id: "inv-" + inv.id, first: cap(local[0]), last: cap(local[1] || ""), email: inv.email, perm: inv.perm,
      title: "—", role: "Invited", lastActive: null, status: inv.status };
  })();
  const profileUser = removed ? removed.user : (inviteUser || members.find((m) => m.id === profileId));
  const profileView = (profileId || removed || inviteProfileId) && profileUser && can("viewUserProfiles") ? (
    <window.AXUserProfile
      user={profileUser} can={can} removed={!!removed}
      onBack={() => { const wasInvite = !!inviteProfileId; setRemoved(null); setProfileId(null); setInviteProfileId(null); setTab(wasInvite ? "invites" : "members"); }}
      onUndo={() => undoRemove(removed)}
      seatsLeft={seatsLeft}
      onSaveProfile={(patch) => {
        setMembers((l) => l.map((x) => x.id === profileUser.id ? { ...x, ...patch } : x));
        toast("ok", "Profile updated", <React.Fragment><b>{(patch.first + " " + patch.last).trim()}</b>’s profile has been updated.</React.Fragment>, [{ label: "Dismiss", plain: true }]);
      }}
      onChangeTz={(tz) => {
        setMembers((l) => l.map((x) => x.id === profileUser.id ? { ...x, tz } : x));
        toast("ok", "Preferences updated", <React.Fragment>Time zone set to <b>{tz}</b>.</React.Fragment>, [{ label: "Dismiss", plain: true }]);
      }}
      onToggleActive={() => setConfirmCfg({
        title: (profileUser.status === "Active" ? "Deactivate " : "Activate ") + profileUser.first + " " + profileUser.last + "?",
        body: profileUser.status === "Active"
          ? "They will lose access to the organization immediately. Their orders stay with the organization."
          : "They will regain access to the organization and can sign in again.",
        cta: profileUser.status === "Active" ? "Deactivate User" : "Activate User", danger: profileUser.status === "Active",
        run: () => {
          const next = profileUser.status === "Active" ? "Inactive" : "Active";
          setMembers((l) => l.map((x) => x.id === profileUser.id ? { ...x, status: next } : x));
          toast("ok", next === "Active" ? "User activated" : "User deactivated",
            <React.Fragment><b>{(profileUser.first + " " + profileUser.last).trim()}</b>{next === "Active" ? " has regained access to this account." : " no longer has access to this account."}</React.Fragment>,
            [{ label: "Dismiss", plain: true }]);
        },
      })}
      onRemove={() => doRemove(profileUser, true)}
      onChangeRole={(v) => {
        if (v === "resend") return resend(byEmail(profileUser.email));
        if (v === "revoke") return revoke(byEmail(profileUser.email));
        if (!can("changeRoles")) return;
        const full = (profileUser.first + " " + profileUser.last).trim();
        if (v === "Administrator" && seatsLeft <= 0) {
          toast("err", "No Administrator seats available",
            <React.Fragment>All {T.MAX_ADMIN_SEATS} Administrator seats are in use. Free a seat before assigning this role.</React.Fragment>,
            [{ label: "Dismiss", plain: true }]);
          return;
        }
        setConfirmCfg({
          title: "Update User Permissions?",
          body: (
            <React.Fragment>
              <p style={{ margin: "0 0 16px", fontSize: 16, lineHeight: 1.55, color: "var(--ax-text-secondary)" }}>Changing this user’s permission level will immediately update what actions and areas they can access.</p>
              <div className="detail-row"><span className="k">Current Role</span><span className="v"><span className={"spill " + T.permClass(profileUser.perm)}>{profileUser.perm}</span></span></div>
              <div className="detail-row"><span className="k">New Role</span><span className="v"><span className={"spill " + T.permClass(v)}>{v}</span></span></div>
            </React.Fragment>
          ),
          cta: "Update Permissions", cancel: "Cancel",
          run: () => {
            setMembers((l) => l.map((x) => x.id === profileUser.id ? { ...x, perm: v } : x));
            toast("ok", "Permissions updated", <React.Fragment><b>{full}</b>’s permissions have been updated.</React.Fragment>, [{ label: "Dismiss", plain: true }]);
          },
        });
      }} />
  ) : ((profileId || removed || inviteProfileId) && !can("viewUserProfiles") ? <Restricted what="user profiles" /> : null);

  if (memberMode) return (
    <div>
      <TopBar user="Benjamin Miller" memberMode showTeam={memberJoined} page={memberPage} onNav={setMemberPage} />
      <main className="page" data-screen-label={memberJoined && memberPage === "team" ? "Team — Member View" : "Orders — Member View"}>
        <window.AXMemberExperience onJoin={joinMember} onDecline={declineMember} toast={toast}
          joined={memberJoined} page={memberPage} onNav={setMemberPage} />
      </main>
      <window.AXPreviewControls open={previewOpen} role={previewRole} setRole={setPreviewRole} onClose={() => setPreviewOpen(false)} />
      <Toasts list={toasts} dismiss={dismiss} />
    </div>
  );

  return (
    <div>
      <TopBar />
      <main className="page" data-screen-label="Team — User Management">
        <div className="page-head" style={profileView ? { display: "none" } : null}>
          <div>
            <h1 className="page-title">User Management</h1>
            <p className="page-sub">Here you can see manage all users, create new roles, and set permissions</p>
          </div>
          {can("inviteUsers") ? <button className="btn-primary" onClick={() => setInvite(true)}><i className="bi bi-person-plus"></i>Invite User</button> : null}
        </div>

        <div className="tabs" role="tablist" style={profileView ? { display: "none" } : null}>
          <button className={"tab" + (tab === "team" ? " on" : "")} role="tab" aria-selected={tab === "team"} onClick={() => setTab("team")}>My Team</button>
          {can("viewUsers") ? <button className={"tab" + (tab === "members" ? " on" : "")} role="tab" aria-selected={tab === "members"} onClick={() => setTab("members")}>Team Members <span className="tcount">{roster.length}</span></button> : null}          {can("viewSentInvites") ? <button className={"tab" + (tab === "invites" ? " on" : "")} role="tab" aria-selected={tab === "invites"} onClick={() => setTab("invites")}>Invitations <span className="tcount">{pendingCount}</span></button> : null}
        </div>

        {profileView}
        {profileView ? null : tab === "team" ? <MyTeam members={members} invites={invites} onManage={() => setTab("members")} onInvites={() => setTab("invites")} /> : null}
        {!profileView && tab === "members" && !can("viewUsers") ? <Restricted what="Team Members" /> : null}
        {!profileView && tab === "members" && can("viewUsers") ? (
          <TeamMembers members={members} load={load} reload={reload} toast={toast} setMembers={setMembers}
            can={can} onRemoveUser={(m) => setRemoveTarget(m)}
            onInvite={() => setInvite(true)}
            openProfile={(m) => openMemberProfile(m.id)}
            openRole={(m) => setRoleModal(m)}
            confirm={(cfg) => setConfirmCfg(cfg)} />
        ) : null}
        {!profileView && tab === "invites" && !can("viewSentInvites") ? <Restricted what="Invitations" /> : null}
        {!profileView && tab === "invites" && can("viewSentInvites") ? (
          <Invitations invites={invites} setInvites={setInvites} load={load} reload={reload} toast={toast}
            can={can} resend={resend} revoke={revoke} busy={busy} openProfile={(inv) => openInviteProfile(inv.id)}
            onInvite={() => setInvite(true)} confirm={(cfg) => setConfirmCfg(cfg)} />
        ) : null}
      </main>

      {invite && can("inviteUsers") ? <InviteModal onClose={() => setInvite(false)} onSent={sendInvite} seatsLeft={seatsLeft} knownEmails={knownEmails} /> : null}
      {userModal ? (
        <UserModal user={userModal.user} edit={userModal.edit} acts={userModal.acts} onClose={() => setUserModal(null)}
          onSave={({ title, perm }) => {
            setMembers((l) => l.map((x) => x.id === userModal.user.id ? { ...x, title, perm } : x));
            setUserModal(null);
            toast("ok", "Changes saved", userModal.user.first + "’s profile has been updated.");
          }} />
      ) : null}
      {roleModal ? (
        <RoleModal user={roleModal} seatsLeft={seatsLeft} onClose={() => setRoleModal(null)}
          onSave={(perm) => {
            const id = roleModal.id, full = (roleModal.first + " " + roleModal.last).trim();
            setMembers((l) => l.map((x) => x.id === id ? { ...x, perm } : x));
            setRoleModal(null);
            toast("ok", "Role updated",
              <React.Fragment><b>{full}</b> is now a {perm} user. The new permissions take effect immediately.</React.Fragment>,
              [{ label: "Dismiss", plain: true }, { label: "View Profile", onClick: () => openMemberProfile(id) }]);
          }} />
      ) : null}
      {removeTarget && can("removeUser")
        ? <window.AXRemoveUserModal user={removeTarget} onClose={() => setRemoveTarget(null)}
            onRemove={() => { const m = removeTarget; setRemoveTarget(null); doRemove(m, false); }} />
        : null}
      {confirmCfg ? <ConfirmModal cfg={confirmCfg} onClose={() => setConfirmCfg(null)} /> : null}
      <window.AXPreviewControls open={previewOpen} role={previewRole} setRole={setPreviewRole} onClose={() => setPreviewOpen(false)} />
      <Toasts list={toasts} dismiss={dismiss} />
    </div>
  );
}
Object.assign(window, { AXPermissionSelect: PermissionSelect });
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
