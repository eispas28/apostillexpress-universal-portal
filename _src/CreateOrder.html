<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Your Apostille Application — ApostilleXpress</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/shadows.css">
<link rel="stylesheet" href="ds/tokens/base.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/_ds_bundle.js"></script>
<script src="./statesData.js"></script>
<script src="./geoData.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="./orderData.js"></script>
<link rel="stylesheet" href="ax-overlays.css">
<style>.fmt-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.fmt-pill{display:inline-flex;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--ax-info-50,#EFF8FF);color:var(--ax-info-700,#005A99);white-space:nowrap}.fmt-badges .wk-pill{margin:0}.fmt-pill.paper{background:var(--ax-warning-50,#FFF6E5);color:var(--ax-warning-700,#8A5300)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}
/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:36px;height:72px;padding:0 40px;background:var(--ax-surface-card);border-bottom:1px solid var(--ax-border-subtle)}
.tb-logo{display:flex;align-items:center;flex-shrink:0}
.tb-nav{display:flex;align-items:center;gap:28px;flex:1}
.tb-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ax-text-tertiary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;transition:color .15s ease}
.tb-link i{font-size:18px}
.tb-link:hover,.tb-link.active{color:var(--ax-gray-700,#414651)}.tb-link.active{font-weight:600}.tb-link,.tb-link:focus,.tb-link:focus-visible,.tb-link.active{outline:none;box-shadow:none;border:none}
.tb-profile{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;font-size:16px;font-weight:500;color:var(--ax-text-primary)}
.tb-profile i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary)}
.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-100)}
.tb-profile-btn i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:0 12px 24px -8px rgba(10,13,18,.18);padding:8px;z-index:40}
.tb-menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:8px;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s ease}
.tb-menu-item:hover{background:var(--ax-gray-100)}
.tb-menu-item i{font-size:18px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.tb-menu-sep{border:none;border-top:1px solid var(--ax-border-subtle);margin:6px 6px}
/* ---- Page ---- */
.page{max-width:none;margin:0 165px;padding:38px 40px 60px}
.draft-bar{position:absolute;top:92px;right:205px;z-index:20}@media (max-width:1100px){.draft-bar{position:static;display:flex;justify-content:flex-end;padding:14px 18px 0}}
.page-title{font-size:24px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.page-sub{font-size:16px;color:var(--ax-text-tertiary);margin:8px 0 28px}
.card{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:14px;box-shadow:var(--ax-shadow-xs)}
/* ---- Screen 1 steps ---- */
.steps{padding:14px 36px}
.step{display:flex;gap:26px;align-items:flex-start;padding:26px 0;border-bottom:1px solid var(--ax-border-subtle)}
.step:last-child{border-bottom:none}
.step-num{flex-shrink:0;width:44px;font-size:44px;line-height:1;font-weight:700;color:var(--ax-sea-depths);text-align:center}
.step-title{font-size:20px;font-weight:700;margin:0;line-height:1.3}
.step-desc{font-size:16px;color:var(--ax-text-tertiary);margin:6px 0 0;line-height:1.45}
/* ---- Footer rows ---- */
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:26px;flex-wrap:wrap}
.foot-actions{display:flex;align-items:center;gap:14px}
.dontshow{display:inline-flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary);cursor:pointer;user-select:none}
.dontshow input{position:absolute;opacity:0;width:0;height:0}
.cbox{width:20px;height:20px;border:1.5px solid var(--ax-border-strong);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--ax-surface-card);transition:background .12s ease,border-color .12s ease;flex-shrink:0}
.dontshow input:checked + .cbox,.certify.on .cbox{background:var(--ax-sea-depths);border-color:var(--ax-sea-depths)}
.cbox i{color:#fff;font-size:13px;opacity:0;transition:opacity .1s ease}
.dontshow input:checked + .cbox i,.certify.on .cbox i{opacity:1}
.dontshow input:focus-visible + .cbox{box-shadow:var(--ax-focus-ring)}
/* ---- Screen 2 ---- */
.s2-card{padding:30px}
.searchbar{display:flex;gap:14px;align-items:stretch}
.searchfield{flex:1;display:flex;align-items:center;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;padding:0 16px;box-shadow:var(--ax-shadow-xs);transition:border-color .12s ease,box-shadow .12s ease}
.searchfield:focus-within{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.searchfield input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ax-text-primary);padding:15px 0;min-width:0}
.searchfield input::placeholder{color:var(--ax-text-placeholder)}
.section-head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-secondary);margin:26px 0 4px}
.section-head i{font-size:17px;color:var(--ax-text-tertiary)}
.section-head.fav i{color:var(--ax-sea-depths)}
.srow{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px 2px;border-bottom:1px solid var(--ax-border-subtle)}
.srow:last-child{border-bottom:none}
.srow-name{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srow-name h3{font-size:22px;font-weight:600;margin:0;line-height:1.25}
.fav-badge{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--ax-sea-depths);background:var(--ax-teal-50);border-radius:6px;padding:3px 10px}
.srow-meta{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.meta-line{display:flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary)}
.meta-line i{font-size:17px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.meta-link{display:inline-flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.meta-link i{font-size:17px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0;text-decoration:none}
.srow-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.star-wrap{position:relative;display:inline-flex}
.starbtn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;color:var(--ax-gray-400);font-size:19px;cursor:pointer;box-shadow:var(--ax-shadow-xs);transition:color .12s ease,border-color .12s ease,background .12s ease}
.starbtn:hover{border-color:var(--ax-border-strong)}
.starbtn.on{color:var(--ax-sea-depths)}
.starbtn:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--ax-midnight-blue);color:#fff;font-size:12px;font-weight:500;white-space:nowrap;padding:6px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:5}
.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ax-midnight-blue)}
.star-wrap:hover .tip{opacity:1}
.unavail{flex-shrink:0;max-width:520px;display:flex;align-items:flex-start;gap:12px;background:var(--ax-teal-50);color:var(--ax-sea-depths);border-radius:10px;padding:16px 18px;font-size:16px;line-height:1.4}
.unavail i{font-size:18px;flex-shrink:0;margin-top:1px}

/* ---- Screen 3: product & service ---- */
.banner{display:flex;gap:14px;align-items:flex-start;background:var(--ax-teal-50);border-radius:12px;padding:20px 24px;margin-bottom:26px;color:var(--ax-text-primary)}
.banner > i{font-size:20px;color:var(--ax-sea-depths);flex-shrink:0;margin-top:1px}
.banner-body{font-size:16px;line-height:1.45}
.banner-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--ax-sea-depths);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.banner-link i{font-size:15px}
.p3-card{padding:30px}
.p3-section{margin-top:26px}
.p3-section:first-child{margin-top:0}
.p3-section-title{font-size:18px;font-weight:700;margin:0 0 14px}
.fmt-grid>.rcard{min-height:112px}.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rcard{border:none;border-radius:12px;box-shadow:0 0 0 1px #CED4DA;padding:16px;cursor:pointer;background:var(--ax-surface-card);transition:background .12s ease,box-shadow .12s ease}
.rcard:hover{background:var(--ax-surface-hover)}
.rcard.sel{background:var(--ax-surface-card);box-shadow:0 0 0 1px #CED4DA}
.rcard-head{display:flex;align-items:flex-start;gap:8px}
.rcard:focus-visible,.fopt:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ax-white),0 0 0 4px rgba(0,182,189,.35)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--ax-border-strong);background:var(--ax-surface-card);flex-shrink:0;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s ease,border-color .12s ease}
.rcard.sel > .rcard-head > .radio,.radio.on{border-color:var(--ax-sea-depths);background:var(--ax-surface-card)}
.radio .dot{width:6px;height:6px;border-radius:50%;background:var(--ax-sea-depths);opacity:0;transition:opacity .1s ease}
.rcard.sel > .rcard-head > .radio .dot,.radio.on .dot{opacity:1}
.rcard-title{font-size:14px;font-weight:600;color:var(--ax-text-secondary);line-height:1;font-family:var(--ax-font-base)}
.rcard-sub{font-size:14px;color:var(--ax-text-secondary);line-height:1.35;margin-top:4px}
.rcard.feat{padding:16px}.feat-row{width:100%;display:flex;align-items:stretch;justify-content:space-between;gap:24px}.feat-main{min-width:0}.feat-tag{font-size:16px;font-weight:700;color:var(--ax-sea-depths);margin-top:14px}.feat-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0}.feat-badge{background:#CFF3F6;color:var(--ax-sea-depths);font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border-radius:6px;padding:5px 10px}.feat-icon{width:48px;height:48px;display:block}.rcard.feat .rcard-title{line-height:1.2}
.rcard-reveal{margin-top:16px;border-top:1px solid var(--ax-border-subtle);padding-top:16px}
.flabel{display:block;font-size:15px;color:var(--ax-text-primary);margin-bottom:7px}
.req{color:var(--ax-danger-500)}
.tinput{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.tinput:hover{border-color:var(--ax-border-strong)}
.tinput:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tinput::placeholder{color:var(--ax-text-placeholder)}
.certify{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ax-border);border-radius:10px;padding:14px 16px;margin-top:14px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.certify.on{border-color:#CED4DA}
.certify input{position:absolute;opacity:0;width:0;height:0}
.certify-txt{font-size:15px;line-height:1.45;color:var(--ax-text-primary)}
.fulfil{margin-top:16px;border:1px solid var(--ax-border);border-radius:10px;padding:4px 18px 8px}
.fulfil-title{font-size:15px;font-weight:700;padding:16px 0 6px}
.fopt{display:flex;gap:8px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--ax-border-subtle);cursor:pointer}
.fopt-track{padding:4px 0 18px 24px}




.tm{padding:0;overflow:hidden}.tm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:24px 28px;border-bottom:1px solid var(--ax-border-subtle)}.tm-title{margin:0;font-size:28px;font-weight:700;line-height:1.2}.tm-title span{color:var(--ax-teal-600)}.tm-head p{margin:8px 0 0;font-size:16px;color:var(--ax-text-tertiary)}.tm-body{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px 28px 28px;align-items:stretch;grid-template-rows:auto auto auto 1fr}.tm-card{border:1px solid var(--ax-border-subtle);border-radius:12px;padding:24px;display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:0}.tm-card.hi{border:2px solid #9EEAF9}.tm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.tm-top h3{margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.2}.tm-pill{display:inline-block;background:#CFF4FC;color:var(--ax-sea-depths);font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border-radius:4px;padding:4px 8px}.tm-mark{width:49px;height:auto;flex:none}.tm-truck{width:42px;height:42px;flex:none}.tm-sub{font-size:16px;font-weight:600;margin:18px 0 14px}.tm-ok{color:var(--ax-sea-depths)}.tm-bad{color:var(--ax-danger-600)}.tm-feats{margin-top:20px}.tm-feat{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--ax-border-subtle)}.tm-feat:first-child{border-top:none}.tm-feat img{width:24px;height:24px;flex:none;margin-top:1px}.tm-feat b{display:block;font-size:16px;font-weight:600;color:var(--ax-text-primary)}.tm-feat span{display:block;font-size:14px;color:var(--ax-text-secondary);margin-top:2px}.tm-feat b.tm-price{font-size:24px;color:var(--ax-sea-depths)}@media(max-width:820px){.tm-body{grid-template-columns:1fr;padding:18px}.tm-head{padding:18px}.tm-title{font-size:22px}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.plan{border:1px solid var(--ax-border);border-radius:12px;padding:22px;display:flex;flex-direction:column}
.plan.hi{border-color:var(--ax-sea-depths);box-shadow:inset 0 0 0 1px var(--ax-sea-depths)}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-name{font-size:16px;font-weight:700}
.pop{background:var(--ax-teal-50);color:var(--ax-sea-depths);font-weight:700;font-size:12px;border-radius:6px;padding:3px 10px}
.plan-price{font-size:30px;font-weight:700;margin-top:16px;line-height:1}
.plan-when{color:var(--ax-text-tertiary);font-size:14px;margin-top:6px}
.plan-btn-wrap{margin-top:18px}
.feats{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.feat{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4}
.feat i{font-size:17px;flex-shrink:0;margin-top:1px}
.feat.pos i{color:var(--ax-success-600)}
.feat.neg i{color:var(--ax-gray-500)}
.feat b{font-weight:700;color:var(--ax-text-primary)}
.feat span{color:var(--ax-text-secondary)}





/* ---- Save as Profile Address ---- */
.pa-prompt{display:flex;align-items:center;gap:12px;background:var(--ax-gray-100);border:1px solid var(--ax-gray-200);border-radius:10px;padding:14px 16px;margin-top:18px}
.pa-prompt > i{font-size:20px;color:var(--ax-gray-500);flex-shrink:0}
.pa-txt{flex:1;min-width:0}
.pa-title{font-size:15px;font-weight:600;color:var(--ax-text-primary)}
.pa-help{font-size:14px;color:var(--ax-text-secondary);margin-top:2px}
.pa-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pa-saved{position:relative;display:flex;align-items:center;gap:12px;background:var(--ax-success-50);border:1px solid var(--ax-success-200);border-radius:10px;padding:14px 16px;margin-top:18px;overflow:hidden;cursor:default}
.pa-saved:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ax-success-600)}
.pa-saved > i{font-size:20px;color:var(--ax-success-600);flex-shrink:0}
.pa-saved .pa-title{color:#14663F}
.pa-saved .pa-help{color:#4B6B5A}
.pa-undo{display:inline-flex;align-items:center;gap:8px;background:var(--ax-white);border:1px solid var(--ax-success-200);border-radius:6px;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;color:#14663F;cursor:pointer;transition:background .12s ease,border-color .12s ease}
.pa-undo:hover{background:var(--ax-success-50);border-color:var(--ax-success-600)}
.pa-undo:active{transform:translateY(.5px)}
.pa-undo:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(0,182,189,.35)}
@media(max-width:640px){.pa-prompt,.pa-saved{flex-wrap:wrap}.pa-actions{width:100%;justify-content:flex-end}}

/* ---- Customer Information ---- */
.actionbar{display:flex;align-items:center;gap:14px;border:1px solid var(--ax-border);border-radius:10px;padding:14px 16px}
.linkbtn{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-text-tertiary);cursor:pointer;padding:8px 4px;transition:color .12s ease}
.linkbtn:hover:not(:disabled){color:var(--ax-text-primary)}
.linkbtn:disabled{color:var(--ax-text-disabled);cursor:default}
.cbanner{display:flex;align-items:flex-start;gap:12px;border-radius:10px;padding:14px 18px;font-size:15px;line-height:1.45;margin-top:18px}
.cbanner.warn{background:var(--ax-warning-50);color:var(--ax-warning-700)}
.cbanner.err{background:var(--ax-danger-50);color:var(--ax-danger-600)}
.cbanner .x{margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;font-size:16px;line-height:1;padding:2px;display:inline-flex;flex-shrink:0;opacity:.7}
.cbanner .x:hover{opacity:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;margin-top:22px}
.field{display:flex;flex-direction:column;min-width:0}
.field.full{grid-column:1 / -1}
.flabel2{font-size:15px;font-weight:500;color:var(--ax-text-primary);margin-bottom:7px}

.tselect-wrap{position:relative}

function ProfileMenu() {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {

    const onDoc = (e) => {if (ref.current && !ref.current.contains(e.target)) setOpen(false);};

function SelectStateScreen({ onCancel, onPrevious, onSelectState }) {
  const all = window.STATES_DATA || [];
  const [query, setQuery] = useState("");
  const [input, setInput] = useState("");
  const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem("ax_fav_states")) || []; } catch (e) { return []; } });
  const [toasts, setToasts] = useState([]);
  const timers = useRef({});

  useEffect(() => () => Object.values(timers.current).forEach(clearTimeout), []);
  // Favorites persist across navigation, new orders, and sessions.
  useEffect(() => { try { localStorage.setItem("ax_fav_states", JSON.stringify(favs)); } catch (e) {} }, [favs]);

  const pushToast = (t) => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { ...t, id }]);
    timers.current[id] = setTimeout(() => {
      setToasts((prev) => prev.filter((x) => x.id !== id));
      delete timers.current[id];
    }, 3200);
  };

  const toggleFav = (s) => {
    setFavs((prev) => {
      const has = prev.includes(s.id);
      if (has) {
        pushToast({ kind: "success", title: "Removed from Favorites", body: s.short + " removed from favorites." });
        return prev.filter((id) => id !== s.id);
      }
      pushToast({ kind: "success", title: "Added to Favorites", body: s.short + " added to favorites." });
      return [...prev, s.id];
    });
  };

  const q = query.trim().toLowerCase();
  const favAll = all.filter((s) => favs.includes(s.id));
  const otherAll = all.filter((s) => !favs.includes(s.id));
  const matches = q ? all.filter((s) => s.name.toLowerCase().includes(q)) : [];
  const searchResults = matches.filter((s) => !favs.includes(s.id));

  // Favorites persist across orders and sessions (localStorage). Once you have
  // favorites, the default view shows only those. Searching surfaces matching
  // states on top with favorites below. New users (no favorites) see all states.
  const sections = q ?
  [
  { key: "results", label: "Search Results", icon: "search", items: searchResults },
  { key: "favs", label: "Favorites", icon: "star", fav: true, items: favAll }] :

  favAll.length > 0 ?
  [
  { key: "favs", label: "Favorites", icon: "star", fav: true, items: favAll }] :

  [
  { key: "all", label: "All States", icon: "geo-alt", items: otherAll }];


  const visibleSections = sections.filter((sec) => sec.items.length > 0);

  return (
    <main className="page" data-screen-label="Select State to Request Certification">
      <h1 className="page-title">Select State to Request Certification</h1>
      <p className="page-sub">Select the state where the document was notarized or issued.</p>
      <div className="card s2-card">
        <div className="searchbar">
          <div className="searchfield">
            <input
              type="text"
              placeholder="Search..."
              value={input}
              onChange={(e) => {setInput(e.target.value);setQuery(e.target.value);}}
              onKeyDown={(e) => {if (e.key === "Enter") setQuery(input);}} />
            
          </div>
          <Button variant="primary" size="lg" leadingIcon={<i className="bi bi-search"></i>} onClick={() => setQuery(input)}>Search</Button>
        </div>

        {visibleSections.length === 0 ?
        <div style={{ padding: "48px 8px", textAlign: "center", color: "var(--ax-text-tertiary)" }}>
            <div style={{ fontSize: 17, fontWeight: 600, color: "var(--ax-text-primary)" }}>No states found</div>
            <div style={{ marginTop: 4, fontSize: 15 }}>Try a different search term.</div>
          </div> :

        visibleSections.map((sec) =>
        <Section key={sec.key} label={sec.label} icon={sec.icon} fav={sec.fav}>
              {sec.items.map((s) =>
          <StateRow key={s.id} s={s} isFav={favs.includes(s.id)} onToggleFav={toggleFav} onSelect={onSelectState} />
          )}
            </Section>
        )
        }
      </div>

      <div className="foot-actions" style={{ marginTop: 26 }}>
        <Button variant="tertiary" size="lg" onClick={onCancel}>Cancel</Button>
        <Button variant="secondary" size="lg" onClick={onPrevious}>Previous</Button>
      </div>

      <div className="toast-wrap bottom-right">
        {toasts.map((t) =>
        <Toast key={t.id} kind={t.kind} title={t.title} onClose={() => setToasts((p) => p.filter((x) => x.id !== t.id))}>
            {t.body}
          </Toast>
        )}
      </div>
    </main>);

}

function OrderQR({ value, size = 84 }) {
  let svg = "";
  try {
    const q = window.qrcode(0, "M");
    q.addData(String(value));
    q.make();
    const n = q.getModuleCount();
    let p = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += "M" + c + "," + r + "h1v1h-1z";
    svg = '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code for order ' + value + '"><path d="' + p + '" fill="#212529"/></svg>';
  } catch (e) {}
  return <span dangerouslySetInnerHTML={{ __html: svg }}></span>;
}

function ChooseProductScreen({ form, update, onCancel, onPrevious, onContinue }) {
  const [showTradModal, setShowTradModal] = useState(false);

  const selectTraditional = () => {update({ deliveryMethod: "traditional", fulfilmentType: isWalkIn ? "" : "usps", trackingNumber: "" });setShowTradModal(true);};
  const switchDigital = () => {update({ deliveryMethod: "electronic" });setShowTradModal(false);};
  const continuePaper = () => {setShowTradModal(false);if (!form.fulfilmentType && !isWalkIn) update({ fulfilmentType: "usps" });};

  const isAdoption = form.apostilleRequest === "adoption";
  const isTraditional = form.deliveryMethod === "traditional";
  const isBoth = form.deliveryMethod === "both";

  const adoptionOk = !isAdoption || form.adoptionAgency.trim() && form.adoptionCertified;
  const trackingOk = !((isTraditional || isBoth) && form.fulfilmentType === "prepaid-label" && !form.trackingNumber.trim());
  const wi = walkInFor(form.state);
  const isWalkIn = isWalkInOrder(form);
  // Progressive disclosure: each section unlocks only when the prior one is complete.
  const apostilleReqOk = !!form.apostilleRequest && adoptionOk;
  const deliveryReqOk = !!form.deliveryMethod && trackingOk;

function computeFees(form) {
  if (form.deliveryMethod === "electronic") return { stateFee: 5, stateServiceFee: 0, axFee: 55, intlFee: 0 };
  if (form.deliveryMethod === "traditional") {
    return { stateFee: 5, stateServiceFee: 0, axFee: 0, intlFee: 0 };
  }
  return { stateFee: 0, stateServiceFee: 0, axFee: 0, intlFee: 0 };
}

// Fees for a single line item, based on THAT item's own delivery + fulfillment
// selections (stored on the item). Nothing is inherited between child orders.
function computeItemFees(it, form) {
  if (it && it.walkIn != null ? it.walkIn : isWalkInOrder(form)) { if (((it && it.deliveryMethod) || form.deliveryMethod) === "electronic") return { stateFee: 5, stateServiceFee: 0, axFee: 55, intlFee: 0 }; }
  if (it && it.walkIn != null ? it.walkIn : isWalkInOrder(form)) return { stateFee: (it && it.adoption != null ? it.adoption : form.apostilleRequest === "adoption") ? 5 : 20, stateServiceFee: 0, axFee: 0, intlFee: 0 };
  const dm = (it && it.deliveryMethod) || form.deliveryMethod;
  const ft = (it && it.fulfilmentType != null && it.fulfilmentType !== "") ? it.fulfilmentType : form.fulfilmentType;
  if (dm === "electronic") return { stateFee: 5, stateServiceFee: 0, axFee: 55, intlFee: 0 };
  if (dm === "traditional") return { stateFee: 5, stateServiceFee: 0, axFee: 0, intlFee: 0 };
  return { stateFee: 0, stateServiceFee: 0, axFee: 0, intlFee: 0 };
}

// AX Fee: $55 first digital request, $45 each additional. International shipping: $10 once per order.
function feesForItems(items, form) {
  let n = 0;
  let intl = false;
  return items.map((it) => { const f = { ...computeItemFees(it, form) }; if (f.axFee > 0) { f.axFee = n === 0 ? 55 : 45; n++; } const wk = it && it.walkIn != null ? it.walkIn : isWalkInOrder(form); const dm = (it && it.deliveryMethod) || form.deliveryMethod; const ft = (it && it.fulfilmentType) || form.fulfilmentType; if (!intl && !wk && dm !== "electronic" && ft === "international") { f.intlFee = 10; intl = true; } return f; });
}

  if (!st) return "";
  const m = (st.address || "").match(/,\s*([A-Z]{2})\s+\d{5}/);
  if (m) return m[1];
  return (st.short || st.name || "").replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase();
};

function blurErr(error, touched, required, value, type) {

  if (required && !v) return type === "email" ? "Email is required." : REQ_MSG;

}

// ---- Save this address as the user's Profile Address --------------------
// Single profile address per user; the prompt only appears when the profile
// has no complete address at load, and cascades Customer → Return → Mailing.
const PAContext = React.createContext(null);
const ADDR_SAVE_REQUIRED = ["addr1", "country", "state", "city", "zip"];
// Eligibility is read once at load: the prompt only appears when the profile
// has no complete address at that moment.
function readProfileAddress() {
  try {
    const p = JSON.parse(localStorage.getItem("ax_profile"));
    return p && p.address ? p.address : null;
  } catch (e) {return null;}
}
const PROFILE_ADDRESS_AT_LOAD = readProfileAddress();
const PA_ELIGIBLE_AT_LOAD = !PROFILE_ADDRESS_AT_LOAD || ADDR_SAVE_REQUIRED.some((k) => !String(PROFILE_ADDRESS_AT_LOAD[k] || "").trim());
const addrComplete = (a) => !!a && ADDR_SAVE_REQUIRED.every((k) => String(a[k] || "").trim());
function writeProfileAddress(addr) {
  try {
    const p = JSON.parse(localStorage.getItem("ax_profile")) || {};
    if (addr) {
      p.address = { addr1: addr.addr1 || "", addr2: addr.addr2 || "", country: addr.country || "", state: addr.state || "", city: addr.city || "", zip: addr.zip || "" };
    } else {
      delete p.address;
    }
    localStorage.setItem("ax_profile", JSON.stringify(p));
  } catch (e) {}
}

// Feature toggle: set to true to show the "Save as Profile Address" prompt in the Customer, Return and Mailing sections.
const SHOW_SAVE_PROFILE_ADDRESS = false;
function SaveProfileAddress({ section, addr, label }) {
  if (!SHOW_SAVE_PROFILE_ADDRESS) return null;
  const pa = React.useContext(PAContext);
  const saved = pa && pa.saved;
  const isThis = !!saved && saved.section === section;
  React.useEffect(() => {
    if (isThis) writeProfileAddress(addr);
  });
  if (!pa || !pa.eligible) return null;
  if (saved && !isThis) return null;
  if (isThis) {
    return (
      <div className="pa-saved" role="status">
        <i className="bi bi-check-circle-fill"></i>
        <div className="pa-txt">
          <div className="pa-title">Saved to your profile</div>

        </div>
      </div>);

  }
  if (pa.dismissed[section]) return null;
  const complete = addrComplete(addr);
  return (
    <div className="pa-prompt">
      <i className="bi bi-bookmark"></i>
      <div className="pa-txt">
        <div className="pa-title">Save this as your profile address?</div>
        <div className="pa-help">{complete ?

      <div className="pa-actions">

}

function fmtSize(bytes) {

}

let pdfjsPromise = null;
function loadPdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) pdfjsPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {const L = window.pdfjsLib;L.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'], { type: "text/javascript" }));res(L);};
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
const PDF_DOCS = {};
const fileKind = (f) => /\.pdf$/i.test(f.name) ? "pdf" : /\.(jpe?g|png)$/i.test(f.name) ? "img" : "other";
const loadPdfDoc = (f) => PDF_DOCS[f.id] || (PDF_DOCS[f.id] = loadPdfjs().then((L) => L.getDocument({ url: f.url }).promise));

function LivePage({ page, doc }) {
  const cv = useRef(null);
  useEffect(() => {
    if (!doc || !cv.current) return;
    let task, dead = false;
    doc.getPage(page).then((p) => {
      if (dead) return;
      const base = p.getViewport({ scale: 1 });
      const vp = p.getViewport({ scale: 560 / base.width * 3 });
      const c = cv.current;
      c.width = vp.width;c.height = vp.height;
      c.style.height = 560 * base.height / base.width + "px";
      task = p.render({ canvasContext: c.getContext("2d"), viewport: vp });
      task.promise.catch(() => {});
    });
    return () => {dead = true;if (task) task.cancel();};
  }, [doc, page]);
  return <canvas ref={cv} className="pv-live" />;
}

  useEffect(() => {setPage(1);setRot(0);}, [sel]);

  useEffect(() => {const t = requestAnimationFrame(() => {const s = stageRef.current, c = panRef.current;if (s && c) setView((v) => ({ ...v, x: (s.clientWidth - c.offsetWidth * v.z / 100) / 2, y: 24 }));});return () => cancelAnimationFrame(t);}, [page]);

function ProvideDocumentationScreen({ form, update, onCancel, onPrevious, onContinue }) {
  const d = form.docs;
  const setD = (patch) => update((f) => ({ docs: { ...f.docs, ...(typeof patch === "function" ? patch(f.docs) : patch) } }));
  const isBoth = form.deliveryMethod === "both";
  const isElectronic = form.deliveryMethod === "electronic" || isBoth;
  const [errors, setErrors] = useState({});
  const [showPreview, setShowPreview] = useState(false);
  const wi = walkInFor(form.state);
  const isWalkIn = isWalkInOrder(form);
  const walkInDigital = isWalkIn && isElectronic;
  const AXF = window.AX_F || {};
  const showProvideMethod = isElectronic && !isWalkIn && !isBoth && !AXF.uploadOnly;
  const mailOnly = isBoth && !isWalkIn;
  const provideMethodEff = walkInDigital ? "bring" : mailOnly ? "mail" : d.provideMethod;

  // Keep the provide method valid for the chosen order option.
  useEffect(() => {
    const pm = d.provideMethod;
    if (walkInDigital && pm !== "bring") setD({ provideMethod: "bring", files: [] });
    if (!walkInDigital && pm === "bring") setD({ provideMethod: "upload" });
    if (mailOnly && pm !== "mail") setD({ provideMethod: "mail", files: [] });
    if (AXF.uploadOnly && isElectronic && !isWalkIn && !isBoth && pm !== "upload") setD({ provideMethod: "upload" });
  }, [isWalkIn, isElectronic, isBoth]);

  // Prefill name-on-document and the return address from prior steps on first view.
  useEffect(() => {
    const patch = {};
    if (!d.nameOnDoc && (form.customer.firstName || form.customer.lastName)) {
      patch.nameOnDoc = (form.customer.firstName + " " + form.customer.lastName).trim();
    }
    const a = d.returnAddr;
    const addrEmpty = !a.firstName && !a.lastName && !a.addr1 && !a.city && !a.zip;
    if (addrEmpty && d.addrSource === "profile" && PROFILE_ADDRESS) patch.returnAddr = { ...PROFILE_ADDRESS };
    if (Object.keys(patch).length) setD(patch);
  }, []);

  // Version A = electronic + upload (file flow). Otherwise an address flow.
  const isUploadFlow = isElectronic && provideMethodEff === "upload";
  const paperSide = !isElectronic || isBoth;
  const isPickup = false;
  const needsAddress = !(AXF.noInPersonReturn && isWalkIn) && (paperSide || (isElectronic && (isWalkIn || provideMethodEff === "mail")));

  const docInfoValid = !!(d.docType && (d.docDesc || "").trim() && d.destCountry);
  const addrValid = !needsAddress || ["firstName", "lastName", "addr1", "country", "state", "city", "zip"].every((k) => (d.returnAddr[k] || "").trim());
  const filesValid = !isUploadFlow || d.files.length > 0;
  const allRequiredDone = docInfoValid && addrValid && filesValid;

  const validate = () => {
    const e = {};
    if (!d.docType) e.docType = "Required.";
    if (!(d.docDesc || "").trim()) e.docDesc = "Required.";
    if (!d.destCountry) e.destCountry = "Required.";
    if (needsAddress) {
      [["firstName", "First name"], ["lastName", "Last name"], ["addr1", "Address line 1"], ["country", "Country"], ["state", "State"], ["city", "City"], ["zip", "Zip code"]].forEach(([k, lbl]) => {
        if (!(d.returnAddr[k] || "").trim()) e[k] = lbl + " is required.";
      });
    }
    if (isUploadFlow && d.files.length === 0) e.files = "Upload at least one document to continue.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handlePrimary = () => {
    if (isUploadFlow) {
      if (!validate()) return;
      setShowPreview(true);
    } else {
      if (validate()) onContinue();
    }
  };

  return (
    <main className="page" data-screen-label="Provide Documentation">
      <h1 className="page-title">Provide Documentation</h1>
      <p className="page-sub">{isWalkIn ? "Enter the details of the document you'll bring to your appointment." : "Upload digital documents or follow instructions for submitting paper documents."}</p>

      {isWalkIn ?
      <React.Fragment>
      <Banner kind="info" style={{ marginTop: 0, marginBottom: 12 }}>
          <span><span className="ib-title"><b style={{ fontFamily: "var(--ax-font-base)" }}>Bring your original documents to your appointment.</b><br /><span style={{ fontFamily: "var(--ax-font-base)", fontWeight: 400 }}>Original documents are required before your request can be processed. If a document exists only as a digital file, it cannot be submitted through an In-Person request and must be submitted through a separate Online order.</span></span></span>
        </Banner>
      </React.Fragment> :
      null}

      <DocumentInfoSection d={d} setD={setD} errors={errors} walkInPaper={isWalkIn && !isElectronic} walkIn={isWalkIn} digital={isElectronic} />


      {showProvideMethod ? <ProvideMethodSection d={d} setD={setD} walkIn={isWalkIn} mailOnly={mailOnly} /> : null}

      {needsAddress ?
      <ReturnAddressSection
        d={d} setD={setD} customer={form.customer} errors={errors}
        subtitle={<><strong>If we can't process your documents</strong>, we'll mail them back to this address at no cost (unless a prepaid shipping label was provided). This can match your apostille return address, or be different.</>} /> :

      null}

      {isUploadFlow ?
      <React.Fragment>
          <UploadSection d={d} setD={setD} walkIn={isWalkIn} />
          <Banner kind="info" style={{ marginTop: 0, marginBottom: 8 }}>
            <span><span className="ib-title">Review Required</span>Please review all uploaded documents before continuing to confirm they are correct, complete, and legible. Incorrect documents may delay processing.</span>
          </Banner>
        </React.Fragment> :
      null}

      {Object.keys(errors).length ?
      <Banner kind="err" style={{ marginTop: 0, marginBottom: 8 }}>
          <span><span className="ib-title">Missing information</span>{errors.files || "Please complete the required fields highlighted above."}</span>
        </Banner> :
      null}

      <div className="footer-row">
        <div className="foot-actions">
          <Button variant="tertiary" size="lg" onClick={onCancel}>Cancel</Button>
          <Button variant="secondary" size="lg" onClick={onPrevious}>Previous</Button>
        </div>
        <div className="co-fr">{window.AX_COPY && isWalkIn && !isElectronic ? <window.CopyOrderButton origin="docs" disabled={!allRequiredDone} /> : null}<Button variant="primary" size="lg" disabled={!allRequiredDone} onClick={handlePrimary}>
          {isUploadFlow ? "Preview Documents" : "Continue"}
        </Button></div>
      </div>

      {showPreview ? <PreviewModal files={d.files} onClose={() => setShowPreview(false)} onConfirm={() => {setShowPreview(false);onContinue();}} /> : null}
    </main>);

}

function DigitalRecipients({ form, update, onCancel, onPrevious, onContinue }) {

      update({ recipients: [{
          id: "r1",
          firstName: USER_PROFILE.firstName || "",

          email: USER_PROFILE.email || "",

  const recipients = form.recipients || [];
  const setRec = (id, patch) => update((f) => ({ recipients: (f.recipients || []).map((r) => r.id === id ? { ...r, ...patch } : r) }));
  const addRecipient = () => {
    if (recipients.length >= 11) return;
    update((f) => ({ recipients: [...(f.recipients || []).map((r) => ({ ...r, collapsed: true })), blankRecipient("r" + Date.now())] }));
  };
  const delRecipient = (id) => {setErrors({});update((f) => ({ recipients: (f.recipients || []).filter((r) => r.id !== id) }));};
  const toggle = (id) => setRec(id, { collapsed: !recipients.find((r) => r.id === id).collapsed });

  const canContinue = recipients.length > 0 && recValid(recipients[0], 0);

    const all = {};
    recipients.forEach((r, idx) => {
      const e = {};
      if (!r.firstName.trim()) e.firstName = "First name is required.";
      if (!r.lastName.trim()) e.lastName = "Last name is required.";
      if (!r.email.trim()) e.email = "Email is required.";else
      if (!EMAIL_RE.test(r.email.trim())) e.email = "Enter a valid email address.";
      if (!r.confirmEmail.trim()) e.confirmEmail = "Please confirm the email.";else
      if (r.confirmEmail.trim() !== r.email.trim()) e.confirmEmail = "Emails do not match.";
      if (idx > 0 && !r.destCountry) e.destCountry = "Destination country is required.";
      if (Object.keys(e).length) all[r.id] = e;
    });
    setErrors(all);
    if (Object.keys(all).length === 0) onContinue();else
    {
      // expand the first recipient with errors so the user can see them

              <div className="rcpt-collapsed" key={r.id} onClick={() => toggle(r.id)} role="button" tabIndex={0}
              onKeyDown={(ev) => {if (ev.key === "Enter" || ev.key === " ") {ev.preventDefault();toggle(r.id);}}}>

// ---- Step 5: Billing & Payment ----------------------------------------
const fmtMoney = (n) => "$" + Number(n || 0).toFixed(2);
function inPersonSchedule(items, form) {
  const wk = items.filter((it) => it.walkIn != null ? it.walkIn : isWalkInOrder(form));
  const by = {};
  wk.forEach((it) => {
    const nm = it.stateName || (form.state && form.state.name) || "Competent Authority";
    const s = by[nm] || (by[nm] = { name: nm, reg: false, adopt: false, digital: false });
    const dig = (it.deliveryMethod || form.deliveryMethod) === "electronic";
    const ad = it.adoption != null ? it.adoption : form.apostilleRequest === "adoption";
    if (dig) s.digital = true; else if (ad) s.adopt = true; else s.reg = true;
  });
  const states = Object.values(by);
  return { states, anyDigital: states.some((s) => s.digital) };
}

function deriveLineItems(form) {

            <div className="pay-tabs">

                <label className="pm-label">Cardholder Name</label>
                <DSInput invalid={!!(cmsg("cardName", "x"))} placeholder="Full name on card" value={pay.cardName} onBlur={cbl("cardName")} onChange={(e) => setPay({ cardName: e.target.value })} />
                {cmsg("cardName", "Cardholder name is required.")}

                <label className="pm-label">Country or Region</label>
                <div className="card-field-group">
                  <div className="cfg-row">

                  </div>
                  <div className="cfg-row"><input className="cfg-input" inputMode="numeric" placeholder="ZIP" value={pay.zip} onBlur={cbl("zip")} onChange={(e) => setPay({ zip: e.target.value })} /></div>

            <Banner kind="info" style={{ marginTop: 18 }}>

            {touched && !cardValid ? <div className="field-err" style={{ marginTop: 12 }}>Please complete all card fields.</div> : null}
            {sigOver ? <div className="field-err" style={{ marginTop: 12 }}>Reduce the signature count — it can’t exceed the {count} apostille{count === 1 ? "" : "s"} in this order.</div> : null}

            <div className="pay-btn-group">
              <Button variant="primary" size="lg" disabled={sigOver} onClick={submit}>{mixed ? "Pay " + fmtMoney(dueNow) : "Pay"}</Button>
              <Button variant="secondary" size="lg" onClick={onCancel}>Cancel</Button>
            </div>
            <p className="fineprint">By clicking Pay, you agree to the <a href="#terms" onClick={(e) => e.preventDefault()}>Terms</a> and <a href="#privacy" onClick={(e) => e.preventDefault()}>Privacy Policy</a>.</p>

        </div>
      </div>

    </main>);

}

  const contactEmail = m.email || c.email || USER_PROFILE.email || "";

  const qr = (v) => { try { const q = window.qrcode(0, "M"); q.addData(String(v)); q.make(); const n = q.getModuleCount(); let p = ""; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) p += "M" + k + "," + r + "h1v1h-1z"; return '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" width="150" height="150" shape-rendering="crispEdges"><path d="' + p + '" fill="#212529"/></svg>'; } catch (e) { return ""; } };
  const logo = new URL("assets/logos/ax-wordmark.png", location.href).href;
  const pages = items.map((it, i) => {

    const total = (f.stateFee + f.stateServiceFee + f.axFee + f.intlFee).toFixed(2);

      '<h3>Order Information</h3><table class="info">' + row("Sub Order Id", sub) + row("Requester Name", requester) + row("Name on Document", (it && it.name) || nameOnDoc) + row("Document Description", docDesc) + row("Contact Name", contact) + row("Contact Phone", contactPhone) + row("Contact Email", contactEmail) + '</table>' +
      '<table class="two"><tr><th>Fulfillment Method</th><th>Delivery Method</th></tr><tr><td>In-Person (Appointment)</td><td>By Appointment Only</td></tr></table>' +
      '<div class="box"><h4>Appointment Instructions</h4><ul><li>Bring your original documents to your appointment.</li><li>Present this form upon arrival.</li><li>The Competent Authority will scan the QR code to retrieve your order.</li><li>Payment will be collected during your appointment.</li><li>Final fees may change after document review.</li></ul></div>' +

  const css = "body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;color:#212529}.pg{width:7.5in;margin:0 auto;padding:.4in 0;page-break-after:always;box-sizing:border-box;position:relative}.pg:last-child{page-break-after:auto}.seal{width:76px;height:76px;border:1px dashed #A8A29E;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8B6F47;text-transform:uppercase;text-align:center}h1{font-size:34px;text-align:center;margin:0}.st{text-align:center;font-weight:600;font-size:18px;margin-bottom:10px}.band{border-top:2px solid #212529;border-bottom:2px solid #212529;text-align:center;font-size:25px;font-weight:600;padding:6px 0;margin-bottom:12px}.lead{margin:0 0 14px}.k{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}.qrbox{display:flex;border:2px solid #212529;padding:14px 16px}.ql{flex:1;padding-right:16px}.ql p{margin:6px 0 0}.ql .it{font-style:italic;font-size:13px;margin-top:14px}.on{font-size:32px;font-weight:700;line-height:1.2}.qc{width:170px;border-left:1.5px solid #212529;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-left:14px}h3{font-size:18px;text-align:center;margin:16px 0 2px}table{width:100%;border-collapse:collapse}table td,table th{border:1px solid #212529;padding:4px 8px}.info th{text-align:right;width:30%}.info td{text-align:center;font-weight:400}.two{margin:18px 0}.two th{text-align:center}.two td{text-align:center;padding:10px}.box{border:1px solid #212529;padding:12px 16px;margin-bottom:14px}h4{font-size:19px;margin:0 0 6px}.box ul{margin:0;padding-left:22px}.box p{margin:6px 0 0}.fh{display:flex;justify-content:space-between;align-items:baseline}.fh b{font-size:18px}.ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.ft img{height:34px}@media print{.pg{padding:0}}";
  const w = window.open("", "_blank");

  const fees = computeFees(form);
  const code = stateCode(st);
  const deliveryShort = isElectronic ? "Electronic" : "Traditional";
  const count = items.length;
  const itemWalk = (it) => it.walkIn != null ? it.walkIn : isWalkInOrder(form);
  const walkCount = items.filter(itemWalk).length;
  const isWalkIn = walkCount > 0 && walkCount === items.length;
  const mixed = walkCount > 0 && !isWalkIn;
  const walkStates = [...new Set(items.filter(itemWalk).map((it) => it.stateShort || (form.state && form.state.short) || "").filter(Boolean))].join(", ");
  const perItemFees = feesForItems(items, form);
  const sumFee = (k) => perItemFees.reduce((s, f) => s + f[k], 0);
  const stateTotal = sumFee("stateFee");
  const serviceTotal = sumFee("stateServiceFee");
  const axTotal = sumFee("axFee");
  const intlTotal = sumFee("intlFee");
  const grand = stateTotal + serviceTotal + axTotal + intlTotal;
  const dueLater = perItemFees.reduce((s, f, i) => itemWalk(items[i]) ? s + f.stateFee + f.stateServiceFee + f.axFee + f.intlFee : s, 0);
  const dueNow = grand - dueLater;

  const email = c.email || ((form.recipients || [])[0] || {}).email || USER_PROFILE.email;
  const phone = c.phone || form.mailing.phone || "";
  const pay = form.payment;
  const last4 = (pay.cardNumber || "").replace(/\D/g, "").slice(-4) || "9849";

    <div style={{ position: "relative" }}>
      <TopBar />
      {window.AX_F.saveDrafts && screen !== "intro" && screen !== "confirmation" && screen !== "payment" ? <div className="draft-bar"><Button variant="secondary" size="md" onClick={() => setShowDraft(true)}><i className="bi bi-bookmark" style={{ marginRight: 8 }}></i>Save Draft</Button></div> : null}
      {screen === "intro" ?
      <IntroScreen onStart={() => setScreen("select")} onCancel={requestCancel} /> :
      screen === "select" ?
      <SelectStateScreen
        onCancel={requestCancel}
        onPrevious={() => setScreen("intro")}
        onSelectState={(s) => {update((f) => ({ ...(f.pendingApostille ? { apostilleRequest: "", adoptionAgency: "", adoptionCertified: false, deliveryMethod: "", fulfilmentType: "", trackingNumber: "", serviceType: "sameday" } : {}), state: { id: s.id, name: s.name, short: s.short, address: s.address, phone: s.phone, website: s.website }, ...(walkInFor(s).enabled ? ((f.apostilles || []).some((a) => a.stateName === s.name) ? (() => { const pr = f.apostilles.find((a) => a.stateName === s.name); return pr.walkIn ? { orderOption: "walkin", apptAck: true } : { orderOption: "standard", apptAck: false }; })() : (f.apostilles || []).length ? { orderOption: "", apptAck: false } : {}) : { orderOption: "", apptAck: false }) }));setScreen("product");}} /> :

      screen === "product" ?
      <ChooseProductScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("select")}
        onContinue={() => setScreen("customer")} /> :

      screen === "customer" ?
      <CustomerInfoScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("product")}
        onContinue={() => setScreen("docs")} /> :

      screen === "docs" ?
      <ProvideDocumentationScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("customer")}
        onContinue={() => setScreen(isWalkInOrder(form) && form.deliveryMethod !== "electronic" ? "payment" : "recipients")} /> :

      screen === "recipients" ?
      <RecipientsScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("docs")}
        onContinue={() => setScreen("payment")} /> :

      screen === "copy" && copyCtx ?
      <window.CopyOrderScreen ctx={copyCtx} form={form} stateRef={copyStateRef} initial={copyInit.current} onCancel={() => { copyInit.current = null; setScreen("payment"); }} onDone={(k) => { copyInit.current = null; finishCopy(k); }} /> :

      screen === "payment" ?
      <PaymentScreen
        showSig={!!window.AX_F.showSignatures}
        form={form}
        update={update}
        goTo={setScreen}
        onCancel={requestCancel}
        onPrevious={() => setScreen(isPickupOrder || (isWalkInOrder(form) && form.deliveryMethod !== "electronic") ? "docs" : "recipients")}
        onSubmit={() => { removeDraft(); setScreen("confirmation"); }} /> :


      <ConfirmationScreen form={form} onDone={goOrders} />
      }
      {copyNotice ? <div className="scrim"><div className="modal" role="dialog" aria-modal="true" aria-label="Order Delivery Form" style={{ maxWidth: 560, width: "calc(100% - 32px)", padding: 0 }}>
        <div style={{ padding: "28px 32px 20px", borderBottom: "1px solid #DEE2E6" }}><h2 className="modal-title" style={{ margin: 0 }}>Download your Order Delivery Form</h2></div>
        <div style={{ padding: "24px 32px", color: "var(--ax-text-secondary, #495057)", fontSize: 16, lineHeight: 1.5, display: "grid", gap: 16 }}>
          <p style={{ margin: 0 }}>Your copied orders include paper. Download or print the Order Delivery Form and present it to the Competent Authority with your original documents.</p>
          <p style={{ margin: 0 }}>The form stays available after you close this notice.</p>
        </div>
        <div className="modal-foot" style={{ padding: "16px 32px 20px", borderTop: "1px solid #DEE2E6" }}><Button variant="secondary" size="md" onClick={() => setCopyNotice(null)}>I understand</Button><Button variant="primary" size="md" onClick={() => openDeliveryForms(copyNotice)}><i className="bi bi-download" style={{ marginRight: 8 }}></i>Download All Delivery Forms</Button></div>
      </div></div> : null}
      {previewParent ? <PreviewModal files={previewParent} onClose={() => setPreviewParent(null)} onConfirm={() => { setPreviewParent(null); setScreen("copy"); }} /> : null}
      {showDraft ? <SaveDraftModal onClose={() => setShowDraft(false)} onConfirm={saveDraft} /> : null}
      {showCancel ? <CancelModal onClose={() => setShowCancel(false)} onConfirm={goOrders} /> : null}
      {showEmail && screen === "confirmation" ? <OrderEmailPreview form={form} onClose={() => setShowEmail(false)} /> : null}
      <div className="toast-wrap bottom-right">
        {paToasts.map((t) =>
        <Toast key={t.id} kind={t.kind} title={t.title} onClose={() => setPaToasts((q) => q.filter((x) => x.id !== t.id))} />
        )}
      </div>
    </div>
    </PAContext.Provider>);

}

Object.assign(window, { fmtSize, USER_PROFILE, PROFILE_ADDRESS, COUNTRIES, StateField, FULFILMENT, FulfilmentCard, DeleteOrderModal, ReturnAddressSection, RecipientForm, blankRecipient, AddressBlock, PreviewModal, DOC_TYPES, DEST_COUNTRIES, fmtSize, docNo });
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
